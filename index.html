 const liveStores=(storeRes.data||[]).map(s=>{const rs=reviews.filter(r=>r.storeId===s.id);return {id:s.id,vendorId:s.vendor_id,name:s.name,category:s.category,categoryKey:s.category_key,desc:s.description,rating:rs.length?Number((rs.reduce((a,r)=>a+r.stars,0)/rs.length).toFixed(1)):0,ratings:rs.length,time:`${s.prep_minutes} min`,open:s.is_open,image:safeUrl(s.image_url)||imgs.bowl,products:products.filter(p=>p.storeId===s.id)}});

 else if(user){const orderRes=await supabaseClient.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(orderRes.error)throw orderRes.error;db.orders=(orderRes.data||[]).map(o=>({id:o.id,storeId:o.store_id,studentId:o.student_id,student:o.student_name_snapshot,items:(o.order_items||[]).map(i=>({productId:i.product_id,name:i.name_snapshot,price:Number(i.unit_price),qty:i.quantity})),total:Number(o.total),note:o.note,status:o.status,eta:o.eta_minutes,reason:o.decline_reason,created:Date.parse(o.created_at)}));if(db.session.role==='student')db.reviewed=reviews.filter(r=>db.orders.some(o=>o.id===r.orderId)).map(r=>r.orderId)}

async function runAction(action){try{const result=await action();if(result?.error)throw result.error;return result}catch(error){console.error(error);flash(error?.message||'Something went wrong. Please try again.');return null}}
let timer;function flash(s){db.toast=s;render();clearTimeout(timer);timer=setTimeout(()=>{db.toast='';render()},2500)}function store(id){return db.stores.find(s=>s.id===id)}function money(x){return 'RM '+Number(x).toFixed(2)}function safeUrl(value){try{const u=new URL(String(value||''),location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawerItems(){if(db.session?.demo)return `<button onclick="${db.session.role==='vendor'?"setVendor('orders')":"setStudent('browse')"}">${db.session.role==='vendor'?'Sample order queue':'Browse stalls'}</button>${db.session.role==='student'?`<button onclick="setStudent('orders')">My demo orders</button>`:''}<button onclick="exitDemo()">Exit demo</button>`;if(db.session?.role==='vendor'){const st=currentStore();return `<button onclick="setVendor('orders')">Order queue <span>${db.orders.filter(o=>o.storeId===st?.id&&o.status==='pending').length}</span></button><button onclick="setVendor('menu')">Menu & availability</button><button onclick="setVendor('reports')">Sales report</button><button onclick="setVendor('reviews')">Customer reviews</button><button onclick="logout()">Log out</button>`}return `<button onclick="setStudent('browse')">Browse stalls</button><button onclick="setStudent('orders')">My orders</button><button onclick="setStudent('history')">Past orders</button><button onclick="setStudent('profile')">My profile</button>${db.session?'<button onclick="logout()">Log out</button>':`<button onclick="demoModal()">Try sample accounts</button><button onclick="authModal('register')">Register / log in</button>`}`}

function updateSearch(input){const start=input.selectionStart,end=input.selectionEnd;db.query=input.value;save();render();const next=document.querySelector('.search input');if(next){next.focus();if(start!==null&&end!==null)next.setSelectionRange(start,end)}}

function storeCard(s){return `<article class="store-card" onclick="openStore('${s.id}')"><div class="store-image" style="background-image:url('${s.image}')">${!s.open?'<span class="closed">CLOSED</span>':''}</div><div class="store-info"><div class="store-title"><h3>${esc(s.name)}</h3>${s.demo?'<span class="badge">SAMPLE</span>':''}<span class="rating">★ ${s.rating.toFixed(1)} <span style="color:#b18b58;font-weight:500">(${s.ratings})</span></span></div><p>${esc(s.category)} · ${s.products.length} menu favourites</p><div class="meta"><span>◷ ${s.time}</span></div></div></article>`}
function openStore(id){db.selectedStore=id;db.category='All';db.query='';render()}function storeView(){const s=store(db.selectedStore);if(!s){db.selectedStore=null;return browseView()}let products=s.products.filter(p=>(db.category==='All'||p.category===db.category)&&(!db.query||`${p.name} ${p.description}`.toLowerCase().includes(db.query.toLowerCase())));return `<button class="back" onclick="db.selectedStore=null;db.query='';render()">← &nbsp;All stalls</button><div class="store-detail"><div class="store-image" style="background-image:url('${s.image}')"></div><div><div class="eyebrow">${esc(s.category)}</div><h1>${esc(s.name)}</h1><div class="inline"><span class="rating">★ ${s.rating.toFixed(1)} (${s.ratings} reviews)</span><span class="subtle">◷ ${s.time}</span></div><p>${esc(s.desc)}</p></div></div><div class="section-head"><div><h2>Made fresh for you</h2><p>Tap + to add something to your bag.</p></div><label class="search" style="max-width:240px;height:38px">⌕ <input placeholder="Find a dish" value="${esc(db.query)}" oninput="db.query=this.value;render()"></label></div><div class="menu-grid">${products.map(p=>`<article class="menu-card"><img class="food-image" src="${p.image}" alt="${esc(p.name)}"><div class="menu-copy"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span></div><button class="add" ${!p.available?'disabled':''} aria-label="Add ${esc(p.name)}" onclick="addCart('${s.id}','${p.id}')">${p.available?'+':'–'}</button></article>`).join('')||'<div class="empty">No dishes found.</div>'}</div>${db.cart.length?`<div style="position:fixed;bottom:20px;right:24px;z-index:5"><button class="btn primary" onclick="setStudent('cart')">View bag · ${db.cart.reduce((a,i)=>a+i.qty,0)} items · ${money(cartTotal())}</button></div>`:''}`}
function addCart(sid,pid){if(!db.session){demoModal();return}if(db.session.role!=='student'){flash('Student accounts can place orders.');return}if(db.cart.length&&db.cart[0].storeId!==sid){flash('Your bag has items from another stall. Finish or clear it first.');return}let s=store(sid),p=s?.products.find(x=>x.id===pid);if(!s||!!s.demo!==!!db.session.demo){flash('Use a Sample account for sample stalls, or a real account for real stalls.');return}if(!p||!p.available)return;let item=db.cart.find(x=>x.productId===pid);if(item)item.qty++;else db.cart.push({storeId:sid,productId:pid,name:p.name,price:p.price,qty:1});save();flash(`${p.name} added to your bag`)}function cartTotal(){return db.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function studentOrders(history){let arr=db.orders.filter(o=>o.studentId===db.session?.id&&(history?['completed','cancelled','rejected'].includes(o.status):!['completed','cancelled','rejected'].includes(o.status)));return `<div class="welcome"><div><div class="eyebrow">${history?'YOUR PAST ORDERS':'ORDER, MADE EASY'}</div><h1>${history?'Past orders':'My orders'}</h1><p>${history?'Leave a rating for a completed order.':'Follow your order as it is prepared.'}</p></div></div>${arr.length?arr.map(o=>orderCard(o,false)).join(''):'<div class="panel empty"><div>◷</div><h3>No orders here yet</h3><p>When you place an order, you’ll find it here.</p><button class="btn primary" onclick="setStudent(\'browse\')">Browse stalls</button></div>'}`}function orderCard(o,vendor){let s=store(o.storeId),stages=['accepted','preparing','ready','completed'],at=stages.indexOf(o.status),statusLabel={pending:'Awaiting response',accepted:'Accepted',preparing:'Preparing',ready:'Ready',completed:'Completed',cancelled:'Cancelled',rejected:'Declined'}[o.status]||o.status;return `<article class="order-card"><div class="order-top"><div><h3>${esc(s?.name||'Campus stall')} <span class="subtle">· #${o.id}</span></h3><div class="subtle">${new Date(o.created).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div></div><span class="status ${o.status}">${statusLabel}</span>${o.isDemo?'<span class="badge">SAMPLE</span>':''}</div>${o.status==='rejected'?`<div class="notice">Reason from stall: ${esc(o.reason||'Item unavailable')}</div>`:o.status==='cancelled'?`<p class="subtle">This order was cancelled by the student.</p>`:`<div class="progress">${['Accepted','Preparing','Ready','Complete'].map((t,i)=>`<div class="step ${i<=at?'done':''}"><span class="dot">${i<at?'✓':i+1}</span>${t}</div>${i<3?`<div class="connector ${i<at?'done':''}"></div>`:''}`).join('')}</div><div class="inline" style="justify-content:space-between"> async function cancelOrder(id){const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'cancel',p_eta_minutes:null,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'cancel',p_eta_minutes:null,p_reason:''}));if(result){await refreshData();flash('Order cancelled. The store has been notified.')}}function profileView(){let who=db.session?.name||'Guest',month=new Date().getMonth(),spent=db.orders.filter(o=>o.studentId===db.session?.id&&o.status==='completed'&&new Date(o.created).getMonth()===month&&new Date(o.created).getFullYear()===new Date().getFullYear()).reduce((a,o)=>a+o.total,0);return `<div class="welcome"><div><div class="eyebrow">YOUR CAMPUS TABLE</div><h1>My profile</h1><p>Account details and dining summary.</p></div></div><div class="two-col"><section class="panel"><h3>Account details</h3><div class="line-row"><span class="subtle">Name</span><strong>${esc(who)}</strong></div><div class="line-row"><span class="subtle">TP number</span><strong>${esc(db.session?.tpNumber||'')}</strong></div><div class="line-row"><span class="subtle">Email</span><strong>${esc(db.session?.email||'')}</strong></div><div class="line-row"><span class="subtle">Account type</span><strong>Student</strong></div><div class="order-actions"><button class="btn light" onclick="editAccount()">Edit details</button><button class="btn light" onclick="logout()">Log out</button><button class="btn danger" onclick="deleteAccount()">Delete account</button></div></section><section class="panel"><h3>Your spending snapshot</h3><div class="stat" style="border:0;padding:6px 0"><label>Completed orders · this month</label><strong>${money(spent)}</strong><small>Sum of completed order totals</small></div><button class="btn soft" onclick="setStudent('history')">View past orders →</button></section></div>`}function vendorView(){const st=currentStore();if(!st)return `<div class="pan iv>${ord.length?ord.map(o=>orderCard(o,true)).join(''):'<div class="panel empty"><div>✓</div><h3>You’re all caught up</h3><p>New orders will appear here.</p></div>'}`}if(db.vendorTab==='menu'&&db.session?.demo)return `<div class="panel"><h3>Sample menu</h3><p class="subtle">Demo menu is read-only.</p>${st.products.map(p=>`<div class="product-row"><img src="${esc(p.image)}" alt=""><div class="grow"><h4>${esc(p.name)}</h4><span class="subtle">${money(p.price)} · ${esc(p.description)}</span></div><span class="badge">${p.available?'Available':'Sold out'}</span></div>`).join('')}</div>`;if(db.vendorTab==='menu')return `<div class="panel"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><div><h3 style="margin-bottom:3px">Menu & availability</h3><span class="subtle">Edits show on your store page.</span></div><button class="btn primary" onclick="productModal()">＋ Add item</button></div>${st.products.map(p=>`<div class="product-row"><img src="${esc(p.image)}" alt=""><div class="grow"><h4>${esc(p.name)}</h4><span class="subtle">${money(p.price)} · ${esc(p.description)}</span></div><span class="badge">${p.available?'Available':'Sold out'}</span><button class="switch ${p.available?'on':''}" aria-label="Toggle availability" onclick="toggleProduct('${p.id}')"></button><button class="btn light" style="padding:8px" onclick="productModal('${p.id}')">Edit</button></div>`).join('')||'<div class="empty">Add the first item to your menu.</div>'}</div>`;if(db.vendorTab==='reports'){let orders=db.orders.filter(o=>o.storeId===st.id&&o.status==='completed'),gross=orders.reduce((a,o)=>a+o.total,0),completed=orders.length,counts={};orders.forEach(o=>o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));return `<div class="stats"><div class="stat"><label>Sales this month</label><strong>${money(gross)}</strong><small>Completed orders only</small></div><div class="stat"><label>Orders completed</label><strong>${completed}</strong><small>All-time total</small></div><div class="stat"><label>Average order</label><strong>${money(completed?gross/completed:0)}</strong><small>Completed orders</small></div><div class="stat"><label>Customer rating</label><strong>${st.ratings?st.rating.toFixed(1):'—'} ★</strong><small>From ${st.ratings} reviews</small></div></div><div class="two-col"><div class="panel"><h3>Popular items</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([name,count],i)=>`<div class="line-row"><span><span class="badge">${i+1}</span> &nbsp;${esc(name)}</span><strong>${count} orders</strong></div>`).join('')||'<p class="subtle">Completed order item totals will show here.</p>'}</div><div class="panel"><h3>Sales summary</h3><div class="line-row"><span class="subtle">Completed order sales</span><strong>${money(gross)}</strong></div><p class="subtle">Sales are calculated from completed orders.</p></div></div>`}if(db.vendorTab==='store'&&db.session?.demo)return '<div class="panel empty"><h3>Sample account</h3><p>Sample stall details are read-only in the demo.</p></div>';if(db.vendorTab==='store')return `<div class="panel"><h3>Store profile</h3><form onsubmit="saveStore(event)"><div class="form-row"><label>Store name</label><input class="field" name="name" value="${esc(st.name)}" required maxlength="100"></div><div class="form-row"><label>Category</label><select class="field" name="category"><option ${st.categoryKey==='Asian'?'selected':''}>Asian</option><option ${st.categoryKey==='Cafe'?'selected':''}>Cafe</option><option ${st.categoryKey==='Local'?'selected':''}>Local</option><option ${st.categoryKey==='Other'?'selected':''}>Other</option></select></div><div class="form-row"><label>Description</label><textarea class="textarea" name="description" maxlength="500">${esc(st.desc)}</textarea></div><div class="form-row"><label>Cover photo URL</label><input class="field" name="image" value="${esc(st.image)}" placeholder="https://…"></div><label class="inline"><input type="checkbox" name="open" ${st.open?'checked':''}> Store is open for orders</label><div style="margin-top:16px"><button class="btn primary">Save store profile</button></div></form></div>`;return `<div class="panel"><h3>Customer reviews <span class="rating">★ ${st.ratings?st.rating.toFixed(1):'—'}</span></h3>${db.reviews.filter(r=>r.storeId===st.id).map(reviewCard).join('')||'<div class="empty">Customer reviews will appear here.</div>'}</div>`}
function setVendorFilter(f){db.vendorFilter=f;render()}
function reviewCard(r){return `<article class="review-card"><div class="inline" style="justify-content:space-between"><div><strong>${esc(r.name)}</strong> <span class="subtle">· Verified order</span></div><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div>${r.tags.map(t=>`<span class="tag" style="display:inline-block;margin:10px 4px 0 0">${esc(t)}</span>`).join('')}<p>${esc(r.text)}</p>${r.reply?`<div class="reply"><strong>${esc(store(r.storeId)?.name||'Stall')} replied</strong><br>${esc(r.reply)}</div>`:db.session?.role==='vendor'&&currentStore()?.id===r.storeId?`<button class="btn soft" onclick="replyModal('${r.id}')">Reply to review</button>`:''}</article>`}
function vendorOrderActions(o){if(o.status==='pending')return `<div class="order-actions"><button class="btn green" onclick="acceptOrder('${o.id}')">Accept order</button><button class="btn danger" onclick="rejectModal('${o.id}')">Decline · add reason</button><span class="subtle" style="align-self:center">Default preparation estimate: 20 min</span></div>`;if(o.status==='accepted')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','preparing')">Start preparing</button><span class="subtle" style="align-self:center">Ready in about ${o.eta} min</span></div>`;if(o.status==='preparing')return `<div class="order-actions"><button class="btn green" onclick="setStatus('${o.id}','ready')">Mark as ready</button></div>`;if(o.status==='ready')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','completed')">Mark completed</button></div>`;return ''}function setStudent(tab){if(tab!=='browse'&&!db.session){authModal('login');return}db.menuOpen=false;if(tab==='cart'){renderCart();return}db.studentTab=tab;db.selectedStore=null;save();render()}function setVendor(tab){db.menuOpen=false;db.vendorTab=tab;render()}function switchRole(role){if(!db.session){authModal('register',role);return}if(db.session.role!==role){flash('This account is registered as '+db.session.role+'. Log out to use another account.');return}render()}function renderCart(){db.studentTab='cart';let s=db.cart.length?store(db.cart[0].storeId):null;document.querySelector('.main').innerHTML=`<div class="welcome"><div><div class="eyebrow">ONE LAST LOOK</div><h1>Your bag</h1><p>${s?`From ${esc(s.name)}`:'Your bag is waiting for something tasty.'}</p></div></div>${db.cart.length?`<div class="two-col"><section class="panel"><h3>Order items</h3>${db.cart.map((i,n)=>`<div class="cart-row"><div><strong>${esc(i.name)}</strong><div class="subtle">${money(i.price)} each</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button>${i.qty}<button onclick="changeQty(${n},1)">+</button><strong style="min-width:67px;text-align:right">${money(i.qty*i.price)}</strong></div></div>`).join('')}<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="btn light" onclick="db.cart=[];save();flash('Bag cleared');renderCart()">Clear bag</button></section><section class="panel"><h3>Order notes</h3><p class="subtle">Anything the stall should know?</p><textarea class="textarea" id="orderNote" placeholder="e.g. No chilli, please"></textarea><button class="btn primary full" onclick="checkout()">Place order · ${money(cartTotal())}</button></section></div>`:'<div class="panel empty"><div>♧</div><h3>Your bag is empty</h3><button class="btn primary" onclick="setStudent(\'browse\')">Explore stalls</button></div>'}`;window.scrollTo(0,0)}function changeQty(n,d){db.cart[n].qty+=d;if(db.cart[n].qty<1)db.cart.splice(n,1);save();renderCart()}async function checkout(){if(!db.session){authModal('register');return}if(db.session.role!=='student'){flash('Student accounts can place orders.');return}if(!db.cart.length)return;const storeId=db.cart[0].storeId,items=db.cart.map(i=>({product_id:i.productId,quantity:i.qty})),note=document.querySelector('#orderNote')?.value||'';const result=await runAction(()=>db.session.demo?supabaseClient.rpc('demo_place_order',{p_store_id:storeId,p_items:items,p_note:note}):supabaseClient.rpc('place_order',{p_store_id:storeId,p_items:items,p_note:note}));if(!result)return;db.cart=[];db.studentTab='orders';save();await runAction(()=>refreshData());flash('Order placed. The store has been notified.')}function acceptOrder(id){modal(`<h2>Accept order</h2><p>Set an estimated preparation time.</p><div class="form-row"><label>Minutes (default 20)</label><input class="field" id="etaMinutes" type="number" min="5" max="180" value="20"></div><button class="btn green full" onclick="confirmAccept('${id}')">Accept order</button>`)}async function confirmAccept(id){const eta=Number(document.querySelector('#etaMinutes')?.value||20);if(!Number.isInteger(eta)||eta<5||eta>180){flash('Enter a time from 5 to 180 minutes.');return}const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'accept',p_eta_minutes:eta,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'accept',p_eta_minutes:eta,p_reason:''}));if(result){closeModal();await refreshData();flash('Order accepted.')}}async function setStatus(id,status){const o=db.orders.find(x=>String(x.id)===String(id));const action=status==='completed'?'complete':status;const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:action,p_eta_minutes:null,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:action,p_eta_minutes:null,p_reason:''}));if(result){await refreshData();flash(status==='ready'?'Student notified: order ready.':'Order status updated.')}}function rejectModal(id){modal(`<h2>Decline this order</h2><p>Let the student know what happened.</p><div class="form-row"><label>Reason</label><textarea class="textarea" id="reason" placeholder="e.g. Tapioca pearls are sold out today" required></textarea></div><div class="order-actions"><button class="btn light" onclick="closeModal()">Keep order</button><button class="btn danger" onclick="rejectOrder('${id}')">Decline order</button></div>`)}async function rejectOrder(id){let reason=document.querySelector('#reason').value.trim();if(!reason){flash('Please add a short reason for the student.');return}const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'reject',p_eta_minutes:null,p_reason:reason}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'reject',p_eta_minutes:null,p_reason:reason}));if(result){closeModal();await refreshData();flash('Student notified that the order was declined.')}}function authModal(mode='register',initialRole='student'){window.authCurrent=mode;window.authTarget=initialRole;modal(`<h2>Welcome to MealSync</h2><p>Create an account to order food or manage a store.</p><div class="tabs"><button class="${mode==='register'?'active':''}" id="tab-register" onclick="authMode('register')">Register</button><button class="${mode==='login'?'active':''}" id="tab-login" onclick="authMode('login')">Log in</button></div><form onsubmit="authSubmit(event)"><div class="form-row" id="name-row"><label>Your name</label><input class="field" name="name" placeholder="e.g. Aisha Rahman" maxlength="80"></div><div class="form-row" id="role-row"><label>Account type</label><select class="field" id="accountRole" name="role" onchange="roleChanged()"><option value="student" ${initialRole==='student'?'selected':''}>Student</option><option value="vendor" ${initialRole==='vendor'?'selected':''}>Vendor</option></select></div><div class="form-row" id="tp-row"><label>TP number</label><input class="field" name="tp_number" placeholder="TP089855" maxlength="12"></div><div id="store-fields" class="${initialRole==='vendor'?'':'hidden'}"><div class="form-row"><label>Store name</label><input class="field" name="store_name" placeholder="e.g. Nook & Noodle" maxlength="100"></div><div class="form-row"><label>Category</label><select class="field" name="store_category"><option>Asian</option><option>Cafe</option><option>Local</option><option>Other</option></select></div><div class="form-row"><label>Store description</label><textarea class="textarea" name="store_description" maxlength="500" placeholder="Tell students what you serve."></textarea></div><div class="form-row"><label>Cover photo URL (optional)</label><input class="field" name="store_image" placeholder="https://…"></div></div><div class="form-row"><label>Email (used to log in)</label><input class="field" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form-row"><label>Password</label><input class="field" name="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="At least 8 characters" minlength="8" required></div><button class="btn primary full" id="auth-submit" type="submit">${mode==='login'?'Log in':'Create account'}</button></form><button class="back" id="forgot-password" onclick="forgotPassword()" style="margin-top:12px;${mode==='login'?'':'display:none'}">Forgot password?</button>`);authMode(mode)}function authMode(m){window.authCurrent=m;document.querySelector('#tab-register').classList.toggle('active',m==='register');document.querySelector('#tab-login').classList.toggle('active',m==='login');const role=document.querySelector('#accountRole').value,isVendor=role==='vendor';document.querySelector('#name-row').classList.toggle('hidden',m==='login');document.querySelector('#role-row').classList.toggle('hidden',m==='login');document.querySelector('#tp-row').classList.toggle('hidden',m==='login'||isVendor);document.querySelector('#store-fields').classList.toggle('hidden',m==='login'||!isVendor);document.querySelector('[name=name]').required=m==='register';document.querySelector('[name=tp_number]').required=m==='register'&&!isVendor;document.querySelector('[name=store_name]').required=m==='register'&&isVendor;document.querySelector('[name=password]').autocomplete=m==='login'?'current-password':'new-password';document.querySelector('#auth-submit').textContent=m==='login'?'Log in':'Create account';document.querySelector('#forgot-password').style.display=m==='login'?'inline-block':'none'}function roleChanged(){authMode(window.authCurrent)}async function authSubmit(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(window.authCurrent==='login'){const r=await runAction(()=>supabaseClient.auth.signInWithPassword({email,password}));if(!r)return;closeModal();await runAction(()=>refreshData());if(db.session)flash('Welcome back, '+db.session.name.split(' ')[0]+'!');return}const role=String(f.get('role')),name=String(f.get('name')).trim(),shop=String(f.get('store_name')||'').trim(),tp=String(f.get('tp_number')||'').trim().toUpperCase();if(role==='student'&&!/^TP\d{6,10}$/.test(tp)){flash('Enter a valid TP number, for example TP089855.');return}if(role==='vendor'&&!shop){flash('Enter your store name.');return}const metadata={full_name:name,role,username:role==='student'?tp:shop};if(role==='student')metadata.tp_number=tp;else Object.assign(metadata,{store_name:shop,store_category:String(f.get('store_category')),store_description:String(f.get('store_description')||''),store_image:String(f.get('store_image')||'')});const r=await runAction(()=>supabaseClient.auth.signUp({email,password,options:{data:metadata,emailRedirectTo:location.origin+location.pathname}}));if(!r)return;if(r.data.session){closeModal();await runAction(()=>refreshData());flash('Account created.')}else{closeModal();modal(`<h2>Check your email</h2><p>We sent a confirmation link to ${esc(email)}. Open it to activate your account, then log in here.</p><button class="btn primary full" onclick="closeModal()">Done</button>`)}}async function forgotPassword(){const email=document.querySelector('[name=email]').value.trim();if(!email){flash('Enter your email address first.');return}const result=await runAction(()=>supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));if(result)flash('Password reset instructions sent. Check your email.')}function passwordRecovery(){modal(`<h2>Choose a new password</h2><form onsubmit="updatePassword(event)"><div class="form-row"><label>New password</label><input class="field" name="new_password" type="password" minlength="8" required></div><button class="btn primary full">Update password</button></form>`)}async function updatePassword(e){e.preventDefault();const password=new FormData(e.target).get('new_password'),r=await runAction(()=>supabaseClient.auth.updateUser({password}));if(r){closeModal();flash('Password updated.')}}async function logout(){if(db.session?.demo){await exitDemo();return}const r=await runAction(()=>supabaseClient.auth.signOut());if(r){db.cart=[];db.studentTab='browse';db.menuOpen=false;save();await refreshData();flash('You are logged out.')}}function editAccount(){if(!db.session)return;modal(`<h2>Edit account</h2><p>Update your display name.</p><div class="form-row"><label>Name</label><input id="editName" class="field" value="${esc(db.session.name)}" maxlength="80"></div><button class="btn primary full" onclick="saveAccount()">Save changes</button>`)}async function saveAccount(){let n=document.querySelector('#editName').value.trim();if(!n)return;const result=await runAction(()=>supabaseClient.from('profiles').update({full_name:n}).eq('id',db.session.id));if(result){closeModal();await refreshData();flash('Account details updated.')}}async function deleteAccount(){if(!db.session||!confirm('Delete your account? Your profile will be deleted and your order and review history anonymized.'))return;const auth=await supabaseClient.auth.getSession();const token=auth.data.session?.access_token;if(!token){flash('Please log in again to delete your account.');return}const res=await fetch(SUPABASE_URL+'/functions/v1/delete-account',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:SUPABASE_KEY}});if(!res.ok){flash('Account deletion is not available yet.');return}await supabaseClient.auth.signOut();db.cart=[];await refreshData();flash('Account deleted. History retained anonymously for store reporting.')}function productModal(id){let st=currentStore(),p=id?st?.products.find(x=>x.id===id):{};if(!st)return;modal(`<h2>${id?'Edit menu item':'Add a menu item'}</h2><p>Keep your menu clear and up to date.</p><form onsubmit="saveProduct(event,'${id||''}')"><div class="form-row"><label>Item name</label><input class="field" name="name" value="${esc(p.name||'')}" required maxlength="100"></div><div class="form-row"><label>Price (RM)</label><input class="field" type="number" name="price" step="0.10" min="0" value="${p.price||''}" required></div><div class="form-row"><label>Description</label><textarea class="textarea" name="description" maxlength="500" required>${esc(p.description||'')}</textarea></div><div class="form-row"><label>Photo URL (optional)</label><input class="field" name="image" value="${esc(p.image||'')}" placeholder="https://…"></div><div class="form-row"><label>Or upload a photo (JPG, PNG or WebP, up to 5 MB)</label><input class="field" type="file" name="photo" accept="image/jpeg,image/png,image/webp"></div><button class="btn primary full">Save item</button></form>`)}async function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),st=currentStore();if(!st)return;let image=String(f.get('image')||'').trim(),file=f.get('photo');if(file?.size){if(file.size>5242880||!['image/jpeg','image/png','image/webp'].includes(file.type)){flash('Choose a JPG, PNG or WebP image under 5 MB.');return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=st.id+'/'+crypto.randomUUID()+'.'+ext;const uploaded=await runAction(()=>supabaseClient.storage.from('menu-images').upload(path,file,{contentType:file.type,upsert:true}));if(!uploaded)return;image=supabaseClient.storage.from('menu-images').getPublicUrl(path).data.publicUrl}else if(!image&&id)image=st.products.find(x=>x.id===id)?.image||'';const p={store_id:st.id,name:String(f.get('name')).trim(),price:Number(f.get('price')),description:String(f.get('description')).trim(),image_url:image,is_available:id?(st.products.find(x=>x.id===id)?.available??true):true};const result=id?await runAction(()=>supabaseClient.from('products').update(p).eq('id',id)):await runAction(()=>supabaseClient.from('products').insert(p));if(!result)return;closeModal();await refreshData();flash(id?'Item updated.':'New item added to your menu.')}async function toggleProduct(id){let st=currentStore(),p=st?.products.find(x=>x.id===id);if(!p)return;const result=await runAction(()=>supabaseClient.from('products').update({is_available:!p.available}).eq('id',id));if(result){await refreshData();flash(!p.available?'Item is available again.':'Marked as sold out.')}}function reviewModal(orderId){let o=db.orders.find(x=>x.id===orderId);modal(`<h2>How was your order?</h2><p>Your review helps the campus community choose well.</p><div class="form-row"><label>Rating</label><select id="stars" class="field"><option value="5">★★★★★ — Loved it</option><option value="4">★★★★☆ — Very good</option><option value="3">★★★☆☆ — It was okay</option><option value="2">★★☆☆☆ — Could be better</option><option value="1">★☆☆☆☆ — Disappointed</option></select></div><div class="form-row"><label>Quick notes (optional)</label><div class="filters">${['So flavourful','Very fresh','Good portion','Lovely service','Great value'].map(x=>`<button type="button" class="filter" onclick="this.classList.toggle('active')">${x}</button>`).join('')}</div></div><div class="form-row"><label>Your comment</label><textarea id="reviewText" class="textarea" placeholder="Share a little about your experience…"></textarea></div><button class="btn primary full" onclick="submitReview('${orderId}')">Post review</button>`)}async function submitReview(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let tags=[...document.querySelectorAll('.filters .active')].map(x=>x.textContent),stars=Number(document.querySelector('#stars').value),comment=document.querySelector('#reviewText').value.trim();const result=await runAction(()=>supabaseClient.rpc('submit_review',{p_order_id:id,p_rating:stars,p_tags:tags,p_comment:comment,p_anonymous:true}));if(result){closeModal();await refreshData();flash('Thanks for sharing your experience!')}}function replyModal(id){let r=db.reviews.find(x=>x.id===id);modal(`<h2>Reply to review</h2><p>${esc(r.text)}</p><textarea id="replyText" class="textarea" placeholder="Write a warm reply…"></textarea><button class="btn primary full" style="margin-top:12px" onclick="saveReply('${id}')">Post reply</button>`)}async function saveReply(id){let reply=document.querySelector('#replyText').value.trim();if(!reply)return;const result=await runAction(()=>supabaseClient.rpc('reply_to_review',{p_review_id:id,p_reply:reply}));if(result){closeModal();await refreshData();flash('Reply posted.')}}async function saveStore(e){e.preventDefault();const st=currentStore(),f=new FormData(e.target);if(!st)return;const category=String(f.get('category'));const result=await runAction(()=>supabaseClient.from('stores').update({name:String(f.get('name')).trim(),category_key:category,category:category==='Asian'?'Asian comfort':category==='Cafe'?'Coffee & brunch':category==='Local'?'Local favourites':'Other',description:String(f.get('description')||'').trim(),image_url:safeUrl(String(f.get('image')||'').trim()),is_open:f.get('open')==='on'}).eq('id',st.id));if(result){await refreshData();flash('Store profile updated.')}}
function modal(html){let old=document.querySelector('.modal-bg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<button aria-label="Close" onclick="closeModal()" style="position:absolute;opacity:0;pointer-events:none"></button><div style="text-align:right;margin-top:12px"><button onclick="closeModal()" class="back">Close</button></div></div></div>`)}function closeModal(){document.querySelector('.modal-bg')?.remove()}supabaseClient.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(passwordRecovery,0);return}if(['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(event))setTimeout(()=>runAction(()=>refreshData()),0)});async function boot(){try{await refreshData()}catch(error){console.error('MealSync data connection failed:',error);db.stores=offlineDemoStores;db.reviews=[];db.orders=[];render();flash('Sample stalls are shown in preview mode. Use Live Server with internet for shared orders.')}}boot();
</script></body></html>
