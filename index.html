function storeOpenNow(isOpen,hours={},date=new Date()){if(!isOpen)return false;const keys=Object.keys(hours||{});if(!keys.length)return true;const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuala_Lumpur',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(p=>[p.type,p.value]));const key=parts.weekday.toLowerCase().slice(0,3),day=hours[key];if(!day||day.closed)return false;const now=Number(parts.hour)*60+Number(parts.minute),toMinutes=s=>{const [h,m]=String(s||'').split(':').map(Number);return h*60+m};return now>=toMinutes(day.opens)&&now<toMinutes(day.closes)}

let activeOrderChannel=null,activeStoreChannel=null;function subscribeOrders(){if(activeOrderChannel)supabaseClient.removeChannel(activeOrderChannel);if(activeStoreChannel)supabaseClient.removeChannel(activeStoreChannel);activeStoreChannel=supabaseClient.channel('mealsync-store-availability').on('postgres_changes',{event:'*',schema:'public',table:'stores'},()=>refreshData()).on('postgres_changes',{event:'*',schema:'public',table:'demo_stores'},()=>refreshData()).subscribe();if(!db.session)return;const demo=!!db.session.demo,channel=supabaseClient.channel((demo?'mealsync-demo':'mealsync-live')+'-'+db.session.id);if(demo){channel.on('postgres_changes',{event:'*',schema:'public',table:'demo_orders'},()=>refreshData()).on('postgres_changes',{event:'*',schema:'public',table:'demo_products'},()=>refreshData()).on('postgres_changes',{event:'*',schema:'public',table:'demo_reviews'},()=>refreshData())}else channel.on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>refreshData());activeOrderChannel=channel.subscribe()}

function openStore(id){db.selectedStore=id;db.category='All';db.query='';render()}function todayHoursText(s){const hours=s.openingHours||{},keys=Object.keys(hours);if(!keys.length)return '';const weekday=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuala_Lumpur',weekday:'short'}).format(new Date()).toLowerCase().slice(0,3),today=hours[weekday];return today?.closed||!today?'Closed today':`Today ${today.opens}–${today.closes}`}function storeView(){const s=store(db.selectedStore);if(!s){db.selectedStore=null;return browseView()}let products=s.products.filter(p=>(db.category==='All'||p.category===db.category)&&(!db.query||`${p.name} ${p.description}`.toLowerCase().includes(db.query.toLowerCase())));const canOrder=db.session?.role==='student'&&!!db.session.demo===!!s.demo,canAddToBag=canOrder||(!db.session&&s.demo);return `<button class="back" onclick="db.selectedStore=null;db.query='';render()">← &nbsp;All stalls</button><div class="store-detail"><div class="store-image" style="background-image:url('${s.image}')"></div><div><div class="eyebrow">${esc(s.category)}</div><h1>${esc(s.name)}</h1><div class="inline"><span class="rating">★ ${s.rating.toFixed(1)} (${s.ratings} reviews)</span><span class="subtle">◷ ${s.time}</span>${todayHoursText(s)?`<span class="subtle">${todayHoursText(s)}</span>`:''}</div><p>${esc(s.desc)}</p></div></div><div class="section-head"><div><h2>Made fresh for you</h2><p>${canOrder?'Tap + to add something to your bag.':db.session?'Browse the menu.':'Guest preview · Sign in or register to add items to your bag.'}</p></div><label class="search" style="max-width:240px;height:38px">⌕ <input placeholder="Find a dish" value="${esc(db.query)}" oninput="db.query=this.value;render()"></label></div><div class="menu-grid">${products.map(p=>`<article class="menu-card"><img class="food-image" src="${esc(p.image)}" alt="${esc(p.name)}"><div class="menu-copy"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span></div>${canAddToBag?`<button class="add" ${!p.available||!s.open?'disabled':''} aria-label="Add ${esc(p.name)} to bag" onclick="addCart('${s.id}','${p.id}')">${s.open&&p.available?'+':'–'}</button>`:''}</article>`).join('')||'<div class="empty">No dishes found.</div>'}</div>${db.cart.length&&canOrder?`<div class="demo-tools" style="position:sticky;bottom:12px"><button class="btn primary" onclick="setStudent('cart')">View bag · ${db.cart.reduce((a,i)=>a+i.qty,0)} items · ${money(cartTotal())}</button></div>`:''}`}
function addCart(sid,pid){if(!db.session){authModal('register');return}if(db.session.role!=='student'){flash('Student accounts can place orders.');return}if(db.cart.length&&db.cart[0].storeId!==sid){flash('Your bag has items from another stall. Finish or clear it first.');return}const s=store(sid),p=s?.products.find(x=>x.id===pid);if(!s||!!s.demo!==!!db.session.demo){flash('Use Demo for sample stalls and a registered account for real stalls.');return}if(!s.open){flash('This stall is not accepting orders right now.');return}if(!p||!p.available)return;const item=db.cart.find(x=>x.productId===pid);if(item)item.qty++;else db.cart.push({storeId:sid,productId:pid,name:p.name,price:p.price,qty:1});flash(`${p.name} added to your bag`)}
function cartTotal(){return db.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function studentOrders(history){let arr=db.orders.filter(o=>(db.session?.demo||o.studentId===db.session?.id)&&(history?['completed','cancelled','rejected'].includes(o.status):!['completed','cancelled','rejected'].includes(o.status)));return `<div class="welcome"><div><div class="eyebrow">${history?'YOUR PAST ORDERS':'ORDER, MADE EASY'}</div><h1>${history?'Past orders':'My orders'}</h1><p>${history?'Leave a rating for a completed order.':'Follow your order as it is prepared.'}</p></div></div>${arr.length?arr.map(o=>orderCard(o,false)).join(''):'<div class="panel empty"><div>◷</div><h3>No orders here yet</h3><p>When you place an order, you’ll find it here.</p><button class="btn primary" onclick="setStudent(\'browse\')">Browse stalls</button></div>'}`}function orderCard(o,vendor){let s=store(o.storeId),stages=['accepted','preparing','ready','completed'],at=stages.indexOf(o.status),statusLabel={pending:'Awaiting response',accepted:'Accepted',preparing:'Preparing',ready:'Ready',completed:'Completed',cancelled:'Cancelled',rejected:'Declined'}[o.status]||o.status;return `<article class="order-card"><div class="order-top"><div><h3>${esc(s?.name||'Campus stall')} <span class="subtle">· #${o.id}</span></h3><div class="subtle">${new Date(o.created).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div></div><span class="status ${o.status}">${statusLabel}</span>${o.isDemo?'<span class="badge">SAMPLE</span>':''}</div>${o.status==='rejected'?`<div class="notice">Reason from stall: ${esc(o.reason||'Item unavailable')}</div>`:o.status==='cancelled'?`<p class="subtle">This order was cancelled by the student.</p>`:`<div class="progress">${['Accepted','Preparing','Ready','Complete'].map((t,i)=>`<div class="step ${i<=at?'done':''}"><span class="dot">${i<at?'✓':i+1}</span>${t}</div>${i<3?`<div class="connector ${i<at?'done':''}"></div>`:''}`).join('')}</div><div class="inline" style="justify-content:space-between"><span class="subtle">${o.status==='ready'?'Your order is ready.':`Estimated ready: ${new Date(o.created+(o.eta||20)*60000).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'})}`}</span><strong>${money(o.total)}</strong></div>`}${vendor?vendorOrderActions(o):o.status==='pending'||(o.status==='accepted'&&o.eta>60)?`<div class="order-actions"><button class="btn danger" onclick="cancelOrder('${o.id}')">Cancel order${o.status!=='pending'?' · long wait':''}</button></div>`:o.status==='completed'&&!db.reviewed.includes(o.id)?`<div class="order-actions"><button class="btn soft" onclick="reviewModal('${o.id}')">★ Rate this order</button></div>`:''}</article>`}
async function cancelOrder(id){const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'cancel',p_eta_minutes:null,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'cancel',p_eta_minutes:null,p_reason:''}));if(result){await refreshData();flash('Order cancelled. The store has been notified.')}}function profileView(){return accountView()}
function accountView(){const demo=!!db.session?.demo,st=db.session?.role==='vendor'?currentStore():null,spent=db.orders.filter(o=>o.studentId===db.session?.id&&o.status==='completed').reduce((a,o)=>a+o.total,0);return `<div class="welcome"><div><div class="eyebrow">YOUR CAMPUS TABLE</div><h1>Account details</h1><p>${demo?'Sample account · Shared Demo workspace':'Your MealSync account'}</p></div></div><div class="two-col"><section class="panel"><h3>Account</h3><div class="line-row"><span class="subtle">Role</span><strong>${demo?'Demo · ':''}${db.session.role==='vendor'?'Vendor':'Student'}</strong></div><div class="line-row"><span class="subtle">Username</span><strong>${esc(db.session.username||db.session.name)}</strong></div>${db.session.role==='student'?`<div class="line-row"><span class="subtle">TP number</span><strong>${esc(db.session.tpNumber||'')}</strong></div>`:''}${st?`<div class="line-row"><span class="subtle">Stall</span><strong>${esc(st.name)}</strong></div><div class="line-row"><span class="subtle">Stall type</span><strong>${esc(st.category)}</strong></div>`:''}<div class="order-actions">${!demo?'<button class="btn light" onclick="editAccount()">Edit display name</button>':''}<button class="btn danger" onclick="logout()">${demo?'Exit demo':'Log out'}</button></div></section>${demo?`<section class="panel"><h3>Demo workspace</h3><p class="subtle">Reset clears the shared sample orders and restores sample menus for everyone using Demo.</p><button class="btn light" onclick="resetDemo()">Reset shared demo</button></section>`:db.session.role==='student'?`<section class="panel"><h3>Dining summary</h3><div class="stat" style="border:0;padding:6px 0"><label>Completed orders</label><strong>${money(spent)}</strong><small>Saved to your account</small></div><button class="btn soft" onclick="setStudent('history')">View past orders →</button></section>`:`<section class="panel"><h3>Stall workspace</h3><p class="subtle">Manage your menu, orders and stall profile from the navigation menu.</p><button class="btn soft" onclick="setVendor('store')">Open stall profile →</button></section>`}</div>`}
function vendorView(){const st=currentStore();if(db.vendorTab==='account')return accountView();if(!st)return `<div class="panel empty"><h2>Store setup needed</h2><p>Create your store profile to start receiving orders.</p><button class="btn primary" onclick="setVendor('store')">Set up store</button></div>`;return `<div class="welcome"><div><div class="eyebrow">${esc(st.name.toUpperCase())} · ${db.session.demo?'DEMO STALL':'VENDOR STUDIO'}</div><h1>${({orders:'A little order at a time.',menu:'Your menu, your way.',reports:'A good month at a glance.',reviews:'Kind words from your customers.',store:'Your stall profile.'})[db.vendorTab]||'Manage your stall'}</h1><p>Manage your stall and your incoming orders.</p></div><div class="date-note"><span class="tag">● ${st.open?'Open':'Closed'}</span></div></div><section>${vendorTabView()}</section>`}
function vendorTabView(){const st=currentStore();if(!st)return '<div class="panel empty">Store profile not found.</div>';if(db.vendorTab==='orders'){let ord=db.orders.filter(o=>o.storeId===st.id&&(db.vendorFilter==='needsReview'?o.status==='pending':true));return `<div class="tabs"><button class="${db.vendorFilter==='all'?'active':''}" onclick="setVendorFilter('all')">All orders (${db.orders.filter(o=>o.storeId===st.id).length})</button><button class="${db.vendorFilter==='needsReview'?'active':''}" onclick="setVendorFilter('needsReview')">Awaiting acceptance (${db.orders.filter(o=>o.storeId===st.id&&o.status==='pending').length})</button></div>${ord.length?ord.map(o=>orderCard(o,true)).join(''):'<div class="panel empty"><div>✓</div><h3>No orders waiting for acceptance</h3><p>New orders will appear here when students place them.</p></div>'}`}if(db.vendorTab==='menu'&&db.session?.demo)return `<div class="panel"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><div><h3 style="margin-bottom:3px">Sample menu</h3><span class="subtle">Changes are shared in Demo and reset with the sample workspace.</span></div><button class="btn primary" onclick="productModal()">＋ Add item</button></div>${st.products.map(p=>`<div class="product-row"><img src="${esc(p.image)}" alt=""><div class="grow"><h4>${esc(p.name)}</h4><span class="subtle">${money(p.price)} · ${esc(p.description)}</span></div><span class="badge">${p.available?'Available':'Sold out'}</span><button class="switch ${p.available?'on':''}" aria-label="Toggle ${esc(p.name)} availability" onclick="toggleProduct('${p.id}')"></button><button class="btn light" style="padding:8px" onclick="productModal('${p.id}')">Edit</button></div>`).join('')||'<div class="empty">Add the first sample item.</div>'}</div>`;if(db.vendorTab==='menu')return `<div class="panel"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><div><h3 style="margin-bottom:3px">Menu & availability</h3><span class="subtle">Edits show on your store page.</span></div><button class="btn primary" onclick="productModal()">＋ Add item</button></div>${st.products.map(p=>`<div class="product-row"><img src="${esc(p.image)}" alt=""><div class="grow"><h4>${esc(p.name)}</h4><span class="subtle">${money(p.price)} · ${esc(p.description)}</span></div><span class="badge">${p.available?'Available':'Sold out'}</span><button class="switch ${p.available?'on':''}" aria-label="Toggle availability" onclick="toggleProduct('${p.id}')"></button><button class="btn light" style="padding:8px" onclick="productModal('${p.id}')">Edit</button></div>`).join('')||'<div class="empty">Add the first item to your menu.</div>'}</div>`;if(db.vendorTab==='reports'){let orders=db.orders.filter(o=>o.storeId===st.id&&o.status==='completed'),gross=orders.reduce((a,o)=>a+o.total,0),completed=orders.length,counts={};orders.forEach(o=>o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));return `<div class="stats"><div class="stat"><label>Sales this month</label><strong>${money(gross)}</strong><small>Completed orders only</small></div><div class="stat"><label>Orders completed</label><strong>${completed}</strong><small>All-time total</small></div><div class="stat"><label>Average order</label><strong>${money(completed?gross/completed:0)}</strong><small>Completed orders</small></div><div class="stat"><label>Customer rating</label><strong>${st.ratings?st.rating.toFixed(1):'—'} ★</strong><small>From ${st.ratings} reviews</small></div></div><div class="two-col"><div class="panel"><h3>Popular items</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([name,count],i)=>`<div class="line-row"><span><span class="badge">${i+1}</span> &nbsp;${esc(name)}</span><strong>${count} orders</strong></div>`).join('')||'<p class="subtle">Completed order item totals will show here.</p>'}</div><div class="panel"><h3>Sales summary</h3><div class="line-row"><span class="subtle">Completed order sales</span><strong>${money(gross)}</strong></div><p class="subtle">Sales are calculated from completed orders.</p></div></div>`}if(db.vendorTab==='store'&&db.session?.demo)return '<div class="panel empty"><h3>Sample account</h3><p>Sample stall details are read-only in the demo.</p></div>';if(db.vendorTab==='store')return `<div class="panel"><h3>Store profile</h3><form onsubmit="saveStore(event)"><div class="form-row"><label>Store name</label><input class="field" name="name" value="${esc(st.name)}" required maxlength="100"></div><div class="form-row"><label>Category</label><select class="field" name="category"><option ${st.categoryKey==='Asian'?'selected':''}>Asian</option><option ${st.categoryKey==='Cafe'?'selected':''}>Cafe</option><option ${st.categoryKey==='Local'?'selected':''}>Local</option><option ${st.categoryKey==='Other'?'selected':''}>Other</option></select></div><div class="form-row"><label>Description</label><textarea class="textarea" name="description" maxlength="500">${esc(st.desc)}</textarea></div><div class="form-row"><label>Cover photo URL</label><input class="field" name="image" value="${esc(st.image)}" placeholder="https://…"></div><div class="form-row"><strong>Weekly opening hours</strong><p class="subtle">Set different hours by day, or apply Monday’s hours to all days. Times use Malaysia time.</p><label class="inline"><input type="checkbox" name="schedule_enabled" ${Object.keys(st.openingHours||{}).length?'checked':''} onchange="document.querySelector('#opening-hours-fields').disabled=!this.checked"> Use a weekly schedule</label>${renderHoursFields(st.openingHours||{})}<button type="button" class="btn soft" style="margin-top:8px" onclick="applyHoursToAll()">Apply Monday’s hours to every day</button><button type="button" class="btn light" style="margin:8px 0 0 6px" onclick="clearOpeningHours()">Remove schedule</button></div><label class="inline"><input type="checkbox" name="open" ${st.isOpen?'checked':''}> Accepting orders now</label><p class="subtle">Turn this off any time you’re busy or temporarily closed. It pauses new orders immediately.</p><div style="margin-top:16px"><button class="btn primary">Save store profile</button></div></form></div>`;return `<div class="panel"><h3>Customer reviews <span class="rating">★ ${st.ratings?st.rating.toFixed(1):'—'}</span></h3>${db.reviews.filter(r=>r.storeId===st.id).map(reviewCard).join('')||'<div class="empty">Customer reviews will appear here.</div>'}</div>`}

function reviewCard(r){return `<article class="review-card"><div class="inline" style="justify-content:space-between"><div><strong>${esc(r.name)}</strong> <span class="subtle">· ${r.isDemo?'Demo order':'Verified order'}</span></div><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div>${r.tags.map(t=>`<span class="tag" style="display:inline-block;margin:10px 4px 0 0">${esc(t)}</span>`).join('')}${r.text?`<p>${esc(r.text)}</p>`:''}${r.reply?`<div class="reply"><strong>${esc(store(r.storeId)?.name||'Stall')} replied</strong><br>${esc(r.reply)}</div>`:db.session?.role==='vendor'&&currentStore()?.id===r.storeId?`<button class="btn soft" onclick="replyModal('${r.id}')">Reply to review</button>`:''}</article>`}
function vendorOrderActions(o){if(o.status==='pending')return `<div class="order-actions"><button class="btn green" onclick="acceptOrder('${o.id}')">Accept order</button><button class="btn danger" onclick="rejectModal('${o.id}')">Decline · add reason</button><span class="subtle" style="align-self:center">Default preparation estimate: 20 min</span></div>`;if(o.status==='accepted')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','preparing')">Start preparing</button><span class="subtle" style="align-self:center">Ready in about ${o.eta} min</span></div>`;if(o.status==='preparing')return `<div class="order-actions"><button class="btn green" onclick="setStatus('${o.id}','ready')">Mark as ready</button></div>`;if(o.status==='ready')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','completed')">Mark completed</button></div>`;return ''}function setStudent(tab){if(tab!=='browse'&&!db.session){authModal('login');return}db.menuOpen=false;if(tab==='cart'){renderCart();return}db.studentTab=tab;db.selectedStore=null;save();render()}function setVendor(tab){db.menuOpen=false;db.vendorTab=tab;render()}function switchRole(role){if(!db.session){authModal('register',role);return}if(db.session.role!==role){flash('This account is registered as '+db.session.role+'. Log out to use another account.');return}render()}function cartView(){let s=db.cart.length?store(db.cart[0].storeId):null;return `<div class="welcome"><div><div class="eyebrow">ONE LAST LOOK</div><h1>Your bag</h1><p>${s?`From ${esc(s.name)}`:'Your bag is waiting for something tasty.'}</p></div></div>${db.cart.length?`<div class="two-col"><section class="panel"><h3>Order items</h3>${db.cart.map((i,n)=>`<div class="cart-row"><div><strong>${esc(i.name)}</strong><div class="subtle">${money(i.price)} each</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button>${i.qty}<button onclick="changeQty(${n},1)">+</button><strong style="min-width:67px;text-align:right">${money(i.qty*i.price)}</strong></div></div>`).join('')}<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="btn light" onclick="db.cart=[];save();flash('Bag cleared');renderCart()">Clear bag</button></section><section class="panel"><h3>Order notes</h3><p class="subtle">Anything the stall should know?</p><textarea class="textarea" id="orderNote" placeholder="e.g. No chilli, please"></textarea><button class="btn primary full" onclick="checkout()">Place order · ${money(cartTotal())}</button></section></div>`:'<div class="panel empty"><div>♧</div><h3>Your bag is empty</h3><button class="btn primary" onclick="setStudent(\'browse\')">Explore stalls</button></div>'}`}function renderCart(){db.studentTab='cart';document.querySelector('.main').innerHTML=cartView();window.scrollTo(0,0)}function changeQty(n,d){db.cart[n].qty+=d;if(db.cart[n].qty<1)db.cart.splice(n,1);save();renderCart()}async function checkout(){if(!db.session){authModal('register');return}if(db.session.role!=='student'){flash('Student accounts can place orders.');return}if(!db.cart.length)return;const storeId=db.cart[0].storeId,items=db.cart.map(i=>({product_id:i.productId,quantity:i.qty})),note=document.querySelector('#orderNote')?.value||'';const result=await runAction(()=>db.session.demo?supabaseClient.rpc('demo_place_order',{p_store_id:storeId,p_items:items,p_note:note}):supabaseClient.rpc('place_order',{p_store_id:storeId,p_items:items,p_note:note}));if(!result)return;db.cart=[];db.studentTab='orders';save();await runAction(()=>refreshData());flash('Order placed. The store has been notified.')}function acceptOrder(id){modal(`<h2>Accept order</h2><p>Set an estimated preparation time.</p><div class="form-row"><label>Minutes (default 20)</label><input class="field" id="etaMinutes" type="number" min="5" max="180" value="20"></div><button class="btn green full" onclick="confirmAccept('${id}')">Accept order</button>`)}async function confirmAccept(id){const eta=Number(document.querySelector('#etaMinutes')?.value||20);if(!Number.isInteger(eta)||eta<5||eta>180){flash('Enter a time from 5 to 180 minutes.');return}const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'accept',p_eta_minutes:eta,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'accept',p_eta_minutes:eta,p_reason:''}));if(result){closeModal();await refreshData();flash('Order accepted.')}}async function setStatus(id,status){const o=db.orders.find(x=>String(x.id)===String(id));const action=status==='completed'?'complete':status;const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:action,p_eta_minutes:null,p_reason:''}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:action,p_eta_minutes:null,p_reason:''}));if(result){await refreshData();flash(status==='ready'?'Student notified: order ready.':'Order status updated.')}}function rejectModal(id){modal(`<h2>Decline this order</h2><p>Let the student know what happened.</p><div class="form-row"><label>Reason</label><textarea class="textarea" id="reason" placeholder="e.g. Tapioca pearls are sold out today" required></textarea></div><div class="order-actions"><button class="btn light" onclick="closeModal()">Keep order</button><button class="btn danger" onclick="rejectOrder('${id}')">Decline order</button></div>`)}async function rejectOrder(id){let reason=document.querySelector('#reason').value.trim();if(!reason){flash('Please add a short reason for the student.');return}const o=db.orders.find(x=>String(x.id)===String(id));const result=await runAction(()=>o?.isDemo?supabaseClient.rpc('demo_change_order',{p_order_id:Number(id),p_action:'reject',p_eta_minutes:null,p_reason:reason}):supabaseClient.rpc('change_order',{p_order_id:id,p_action:'reject',p_eta_minutes:null,p_reason:reason}));if(result){closeModal();await refreshData();flash('Student notified that the order was declined.')}}function authPageView(){const mode=window.authCurrent||'login',role=window.authTarget||'student',register=mode==='register',isVendor=role==='vendor';return `<main class="auth-screen"><section class="auth-story"><div class="brand"><div class="brand-mark">⌂</div><div>MealSync<small>GOOD FOOD, AROUND THE CORNER</small></div></div><div class="eyebrow" style="margin-top:32px">YOUR CAMPUS, SERVED FRESH</div><h1>Good food.<br>Good mood.</h1><p>Find campus favourites, follow every order, and let local stalls serve up something lovely.</p><div class="auth-highlights"><span>Browse campus stalls</span><span>Track order updates</span><span>Made for campus</span></div></section><section class="auth-card"><div class="auth-card-head"><div class="brand-mark">⌂</div><div><strong>Welcome to MealSync</strong><div class="subtle">${register?'Create your account':'Sign in to continue'}</div></div></div><h2>${register?'Join the campus table':'Good to see you'}</h2><p>${register?'Choose your role and set up your account. No email needed.':'Use your username and password to continue.'}</p><div class="auth-tabs"><button class="${mode==='login'?'active':''}" onclick="authMode('login')">Log in</button><button class="${register?'active':''}" onclick="authMode('register')">Register</button></div><form onsubmit="authSubmit(event)">${register?`<div class="form-row"><label for="accountRole">I’m joining as</label><select class="field" id="accountRole" name="role" onchange="roleChanged()"><option value="student" ${!isVendor?'selected':''}>Student</option><option value="vendor" ${isVendor?'selected':''}>Vendor</option></select></div>${isVendor?`<div class="form-row"><label>Stall name</label><input class="field" name="store_name" placeholder="e.g. Nook & Noodle" maxlength="100" required></div><div class="form-row"><label>Stall type</label><select class="field" name="store_category"><option value="Asian">Asian comfort</option><option value="Cafe">Cafe & brunch</option><option value="Local">Local favourites</option><option value="Other">Other</option></select></div><div class="form-row"><label>Description (optional)</label><textarea class="textarea" name="store_description" maxlength="500" placeholder="What can students find at your stall?"></textarea></div><div class="form-row"><label>Photo URL (optional)</label><input class="field" name="store_image" type="url" placeholder="https://…"></div>`:`<div class="form-row"><label>TP student number</label><input class="field" name="tp_number" placeholder="TP + 6 digits" maxlength="8" pattern="TP[0-9]{6}" title="Enter TP followed by 6 digits, for example TP089876." required><div class="subtle" style="font-size:11px;margin-top:6px">Example: TP089876</div></div>`}<div class="form-row"><label>Username</label><input class="field" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]" placeholder="Choose a username" required></div><div class="form-row"><label>Password</label><input class="field" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters" required></div>`:`<div class="form-row"><label>Username</label><input class="field" name="username" autocomplete="username" placeholder="Your username" value="${esc(db.authUsername||'')}" oninput="db.authUsername=this.value;clearAuthError()" required></div><div class="form-row"><label>Password</label><input class="field" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="Your password" oninput="clearAuthError()" required></div>`}<button class="btn primary full" id="auth-submit" type="submit">${register?'Create account':'Log in'}</button></form>${db.authError?`<div class="auth-error" role="alert">${esc(db.authError)}</div>`:''}<p class="auth-help">No email is collected. Without an email, password recovery is unavailable, so keep your login details safe.</p><div class="auth-divider">or explore first</div><div class="auth-actions"><button class="btn light" onclick="browseAsGuest()">Browse as guest</button><button class="btn soft" onclick="demoModal()">Try the interactive demo</button></div></section></main>`}function authModal(mode='login',initialRole='student'){window.authCurrent=mode;window.authTarget=initialRole;db.authPage=true;db.menuOpen=false;closeModal();render()}
function clearAuthError(){db.authError='';document.querySelector('.auth-error')?.remove()}function showAuthError(message){db.authError=message==='Incorrect username or password.'?'Incorrect username or password. Please check both fields and try again.':message==='Could not create this account. Check the details and try again.'?'The TP number or username may already be registered. If you already have an account, switch to Log in.':message;render()}function authMode(mode){db.authError='';window.authCurrent=mode;window.authTarget=document.querySelector('#accountRole')?.value||window.authTarget||'student';db.authPage=true;closeModal();render()}
function roleChanged(){window.authTarget=document.querySelector('#accountRole').value;authModal('register',window.authTarget)}
async function authSubmit(event){event.preventDefault();db.authError='';const form=new FormData(event.target),mode=window.authCurrent||'login',username=String(form.get('username')||'').trim();db.authUsername=username;const password=String(form.get('password')||'');const button=document.querySelector('#auth-submit');if(button){button.disabled=true;button.textContent=mode==='register'?'Creating account…':'Logging in…'}try{let body={action:mode,username,password};if(mode==='register'){const role=String(form.get('role')),tp=String(form.get('tp_number')||'').trim().toUpperCase(),storeName=String(form.get('store_name')||'').trim(),description=String(form.get('store_description')||'').trim(),image=String(form.get('store_image')||'').trim();if(!/^[A-Za-z0-9](?:[A-Za-z0-9._-]{1,30}[A-Za-z0-9])$/.test(username)){flash('Username must be 3–32 characters using letters, numbers, dots, hyphens or underscores.');return}if(role==='student'&&!/^TP\d{6}$/.test(tp)){flash('Enter TP followed by 6 digits, for example TP089876.');return}if(role==='vendor'&&!storeName){flash('Enter your stall name.');return}if(image&&!/^https?:\/\//i.test(image)){flash('Photo URL must start with http:// or https://.');return}body={...body,role,tp_number:tp,store_name:storeName,store_category:String(form.get('store_category')||'Other'),store_description:description,store_image:image}}const {data,error}=await supabaseClient.functions.invoke('login-username',{body});if(error){let message='Could not reach the account service. Please try again.';try{const detail=await error.context?.json();message=detail?.error||detail?.message||message}catch{}showAuthError(message);return}if(data?.created){flash(data.message||'Account created. Log in with your username.');authMode('login');return}if(!data?.access_token||!data?.refresh_token){showAuthError(data?.error||'The account service returned an incomplete response.');return}const {error:sessionError}=await supabaseClient.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(sessionError){showAuthError('Account was accepted, but the session could not start. Please log in.');return}localStorage.removeItem('mealsync-demo-session-v1');db.authPage=false;db.cart=[];db.studentTab='browse';db.vendorTab='orders';db.selectedStore=null;db.menuOpen=false;await refreshData();flash(mode==='register'?'Your account is ready.':'Welcome back, '+(db.session?.name||username)+'!')}catch(error){console.error('Account request failed:',error);showAuthError(error?.message||'Could not complete the account request.')}finally{const current=document.querySelector('#auth-submit');if(current){current.disabled=false;current.textContent=(window.authCurrent||'login')==='register'?'Create account':'Log in'}}}
async function forgotPassword(){const email=document.querySelector('[name=email]').value.trim();if(!email){flash('Enter your email address first.');return}const result=await runAction(()=>supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));if(result)flash('Password reset instructions sent. Check your email.')}function passwordRecovery(){modal(`<h2>Choose a new password</h2><form onsubmit="updatePassword(event)"><div class="form-row"><label>New password</label><input class="field" name="new_password" type="password" minlength="8" required></div><button class="btn primary full">Update password</button></form>`)}async function updatePassword(e){e.preventDefault();const password=new FormData(e.target).get('new_password'),r=await runAction(()=>supabaseClient.auth.updateUser({password}));if(r){closeModal();flash('Password updated.')}}async function logout(){if(db.session?.demo){await exitDemo();return}const result=await runAction(()=>supabaseClient.auth.signOut());if(result){localStorage.removeItem('mealsync-demo-session-v1');db.session=null;db.authPage=true;db.cart=[];db.studentTab='browse';db.vendorTab='orders';db.selectedStore=null;db.menuOpen=false;window.authCurrent='login';await refreshData();flash('You are logged out.')}}
function editAccount(){if(!db.session)return;modal(`<h2>Edit account</h2><p>Update your display name.</p><div class="form-row"><label>Name</label><input id="editName" class="field" value="${esc(db.session.name)}" maxlength="80"></div><button class="btn primary full" onclick="saveAccount()">Save changes</button>`)}async function saveAccount(){let n=document.querySelector('#editName').value.trim();if(!n)return;const result=await runAction(()=>supabaseClient.from('profiles').update({full_name:n}).eq('id',db.session.id));if(result){closeModal();await refreshData();flash('Account details updated.')}}async function deleteAccount(){if(!db.session||!confirm('Delete your account? Your profile will be deleted and your order and review history anonymized.'))return;const auth=await supabaseClient.auth.getSession();const token=auth.data.session?.access_token;if(!token){flash('Please log in again to delete your account.');return}const res=await fetch(SUPABASE_URL+'/functions/v1/delete-account',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:SUPABASE_KEY}});if(!res.ok){flash('Account deletion is not available yet.');return}await supabaseClient.auth.signOut();db.cart=[];await refreshData();flash('Account deleted. History retained anonymously for store reporting.')}function productModal(id){const st=currentStore(),p=id?st?.products.find(x=>x.id===id):{};if(!st)return;const demo=!!db.session.demo;modal(`<h2>${id?'Edit menu item':'Add a menu item'}</h2><p>${demo?'Changes are part of the shared Demo.':'Keep your menu clear and up to date.'}</p><form onsubmit="saveProduct(event,'${id||''}')"><div class="form-row"><label>Item name</label><input class="field" name="name" value="${esc(p.name||'')}" required maxlength="100"></div><div class="form-row"><label>Price (RM)</label><input class="field" type="number" name="price" step="0.10" min="0" max="99999" value="${p.price||''}" required></div><div class="form-row"><label>Description</label><textarea class="textarea" name="description" maxlength="500" required>${esc(p.description||'')}</textarea></div><div class="form-row"><label>Photo URL (optional)</label><input class="field" name="image" value="${esc(p.image||'')}" placeholder="https://…"></div>${demo?'':`<div class="form-row"><label>Or upload a photo (JPG, PNG or WebP, up to 5 MB)</label><input class="field" type="file" name="photo" accept="image/jpeg,image/png,image/webp"></div>`}<button class="btn primary full">Save item</button></form>`)}
async function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target),st=currentStore();if(!st)return;let image=String(f.get('image')||'').trim();if(image&&!/^https?:\/\//i.test(image)){flash('Photo URL must start with http:// or https://.');return}const name=String(f.get('name')||'').trim(),description=String(f.get('description')||'').trim(),price=Number(f.get('price')),existing=id?st.products.find(x=>x.id===id):null;if(db.session.demo){const result=await runAction(()=>supabaseClient.rpc('demo_save_product',{p_store_id:st.id,p_product_id:id||null,p_name:name,p_description:description,p_price:price,p_image_url:image,p_is_available:existing?.available??true}));if(result){closeModal();await refreshData();flash(id?'Demo item updated.':'Demo item added.')}return}const file=f.get('photo');if(file?.size){if(file.size>5242880||!['image/jpeg','image/png','image/webp'].includes(file.type)){flash('Choose a JPG, PNG or WebP image under 5 MB.');return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=st.id+'/'+crypto.randomUUID()+'.'+ext;const uploaded=await runAction(()=>supabaseClient.storage.from('menu-images').upload(path,file,{contentType:file.type,upsert:true}));if(!uploaded)return;image=supabaseClient.storage.from('menu-images').getPublicUrl(path).data.publicUrl}else if(!image&&id)image=existing?.image||'';const product={store_id:st.id,name,price,description,image_url:image,is_available:existing?.available??true};const result=id?await runAction(()=>supabaseClient.from('products').update(product).eq('id',id)):await runAction(()=>supabaseClient.from('products').insert(product));if(result){closeModal();await refreshData();flash(id?'Item updated.':'New item added to your menu.')}}
async function toggleProduct(id){const st=currentStore(),item=st?.products.find(x=>x.id===id);if(!item)return;const result=db.session?.demo?await runAction(()=>supabaseClient.rpc('demo_save_product',{p_store_id:st.id,p_product_id:item.id,p_name:item.name,p_description:item.description,p_price:item.price,p_image_url:item.image,p_is_available:!item.available})):await runAction(()=>supabaseClient.from('products').update({is_available:!item.available}).eq('id',id));if(result){await refreshData();flash(!item.available?'Item is available again.':'Marked as sold out.')}}
function renderHoursFields(hours={}){return `<fieldset id="opening-hours-fields" class="hours-grid" ${Object.keys(hours).length?'':'disabled'}>${[['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday'],['fri','Friday'],['sat','Saturday'],['sun','Sunday']].map(([key,label])=>{const h=hours[key]||{};return `<div class="hours-row"><strong>${label}</strong><label><input type="checkbox" name="hours_${key}_closed" ${h.closed?'checked':''} onchange="toggleHoursDay('${key}')"> Closed</label><input class="field" type="time" name="hours_${key}_opens" value="${esc(h.opens||'09:00')}" ${h.closed?'disabled':''}><span>to</span><input class="field" type="time" name="hours_${key}_closes" value="${esc(h.closes||'17:00')}" ${h.closed?'disabled':''}></div>`}).join('')}</fieldset>`}function toggleHoursDay(key){const f=document.querySelector(`[name=hours_${key}_closed]`)?.form;if(!f)return;const closed=f.elements[`hours_${key}_closed`].checked;f.elements[`hours_${key}_opens`].disabled=closed;f.elements[`hours_${key}_closes`].disabled=closed}function applyHoursToAll(){const f=document.querySelector('.hours-grid')?.closest('form');if(!f)return;const open=f.elements.hours_mon_opens.value,close=f.elements.hours_mon_closes.value,closed=f.elements.hours_mon_closed.checked;document.querySelectorAll('.hours-row').forEach((row,i)=>{const key=['mon','tue','wed','thu','fri','sat','sun'][i];f.elements[`hours_${key}_opens`].value=open;f.elements[`hours_${key}_closes`].value=close;f.elements[`hours_${key}_closed`].checked=closed;toggleHoursDay(key)});document.querySelector('#opening-hours-fields').disabled=false;const toggle=document.querySelector('[name=schedule_enabled]');if(toggle)toggle.checked=true}function clearOpeningHours(){const fs=document.querySelector('#opening-hours-fields');if(fs){fs.disabled=true;const toggle=document.querySelector('[name=schedule_enabled]');if(toggle)toggle.checked=false}}function readOpeningHours(form){if(!form.elements.schedule_enabled.checked)return {};const result={};for(const key of ['mon','tue','wed','thu','fri','sat','sun']){const closed=form.elements[`hours_${key}_closed`].checked,opens=form.elements[`hours_${key}_opens`].value,closes=form.elements[`hours_${key}_closes`].value;if(closed){result[key]={closed:true};continue}if(!opens||!closes||opens>=closes)throw new Error('Each opening time must be earlier than its closing time.');result[key]={closed:false,opens,closes}}return result}async function saveStore(e){e.preventDefault();const st=currentStore(),f=e.target;if(!st)return;const category=String(f.elements.category.value);let openingHours;try{openingHours=readOpeningHours(f)}catch(error){flash(error.message);return}const result=await runAction(()=>supabaseClient.from('stores').update({name:String(f.elements.name.value).trim(),category_key:category,category:category==='Asian'?'Asian comfort':category==='Cafe'?'Coffee & brunch':category==='Local'?'Local favourites':'Other',description:String(f.elements.description.value||'').trim(),image_url:safeUrl(String(f.elements.image.value||'').trim()),is_open:f.elements.open.checked,opening_hours:openingHours}).eq('id',st.id));if(result){await refreshData();flash('Store profile updated.')}}function reviewModal(orderId){modal(`<h2>How was your order?</h2><p>Your review helps the campus community choose well.</p><div class="form-row"><label>Rating</label><select id="stars" class="field"><option value="5">★★★★★ — Loved it</option><option value="4">★★★★☆ — Very good</option><option value="3">★★★☆☆ — It was okay</option><option value="2">★★☆☆☆ — Could be better</option><option value="1">★☆☆☆☆ — Disappointed</option></select></div><div class="form-row"><label>Quick notes (optional)</label><div class="filters">${['So flavourful','Very fresh','Good portion','Lovely service','Great value'].map(x=>`<button type="button" class="filter" onclick="this.classList.toggle('active')">${x}</button>`).join('')}</div></div><div class="form-row"><label>Your comment (optional)</label><textarea id="reviewText" class="textarea" maxlength="1000" placeholder="Share a little about your experience…"></textarea></div><button class="btn primary full" onclick="submitReview('${orderId}')">Post review</button>`)}async function submitReview(id){const o=db.orders.find(x=>String(x.id)===String(id));if(!o)return;const tags=[...document.querySelectorAll('.filters .active')].map(x=>x.textContent),stars=Number(document.querySelector('#stars').value),comment=document.querySelector('#reviewText').value.trim();const result=await runAction(()=>o.isDemo?supabaseClient.rpc('demo_submit_review',{p_order_id:Number(id),p_rating:stars,p_tags:tags,p_comment:comment}):supabaseClient.rpc('submit_review',{p_order_id:id,p_rating:stars,p_tags:tags,p_comment:comment,p_anonymous:true}));if(result){closeModal();await refreshData();flash('Thanks for sharing your experience!')}}function replyModal(id){const r=db.reviews.find(x=>String(x.id)===String(id));modal(`<h2>Reply to review</h2><p>${esc(r.text||'Rating only')}</p><textarea id="replyText" class="textarea" placeholder="Write a warm reply…"></textarea><button class="btn primary full" style="margin-top:12px" onclick="saveReply('${id}')">Post reply</button>`)}async function saveReply(id){const reply=document.querySelector('#replyText').value.trim();if(!reply)return;const result=await runAction(()=>db.session?.demo?supabaseClient.rpc('demo_reply_to_review',{p_review_id:Number(id),p_store_id:currentStore()?.id,p_reply:reply}):supabaseClient.rpc('reply_to_review',{p_review_id:id,p_reply:reply}));if(result){closeModal();await refreshData();flash('Reply posted.')}}
function modal(html){let old=document.querySelector('.modal-bg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<button aria-label="Close" onclick="closeModal()" style="position:absolute;opacity:0;pointer-events:none"></button><div style="text-align:right;margin-top:12px"><button onclick="closeModal()" class="back">Close</button></div></div></div>`)}function closeModal(){document.querySelector('.modal-bg')?.remove()}supabaseClient.auth.onAuthStateChange((event)=>{if(['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(event))setTimeout(()=>runAction(()=>refreshData()),0)});async function boot(){try{await refreshData()}catch(error){console.error('MealSync data connection failed:',error);db.stores=offlineDemoStores;db.reviews=[];db.orders=[];render();flash('Sample stalls are shown in preview mode. Use Live Server with internet for shared orders.')}}boot();
</script></body></html>
