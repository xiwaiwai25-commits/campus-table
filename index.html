const seed={stores:[{id:'s1',name:'Nook & Noodle',category:'Asian comfort',desc:'Wok-fired favourites and comforting bowls, made fresh to order.',rating:4.8,ratings:128,time:'15–25 min',open:true,categoryKey:'Asian',image:imgs.noodles,products:[{id:'p1',name:'Ginger Sesame Noodles',description:'Springy noodles, toasted sesame, crisp greens.',price:12.9,image:imgs.noodles,available:true,sold:48},{id:'p2',name:'Crispy Chicken Rice Bowl',description:'Golden chicken, fragrant rice, house chilli.',price:16.5,image:imgs.chicken,available:true,sold:36},{id:'p3',name:'Campus Veggie Bowl',description:'Seasonal greens, brown rice, sesame dressing.',price:13.5,image:imgs.bowl,available:true,sold:24}]},{id:'s2',name:'Little Fern Café',category:'Coffee & brunch',desc:'Thoughtful coffee, warm sandwiches and little pick-me-ups.',rating:4.9,ratings:96,time:'10–20 min',open:true,categoryKey:'Cafe',image:imgs.coffee,products:[{id:'p4',name:'Iced Oat Latte',description:'Double espresso over creamy oat milk.',price:10.5,image:imgs.coffee,available:true,sold:52},{id:'p5',name:'Garden Club Sandwich',description:'Avocado, tomato, greens, herbed cream cheese.',price:15,image:imgs.wrap,available:true,sold:31},{id:'p6',name:'Berry Yogurt Cup',description:'Greek yogurt, berries, house granola.',price:9,image:imgs.dessert,available:true,sold:19}]},{id:'s3',name:'Rice & Rise',category:'Local favourites',desc:'A little taste of home, right around the corner.',rating:4.7,ratings:214,time:'20–30 min',open:true,categoryKey:'Local',image:imgs.rice,products:[{id:'p7',name:'Kampung Fried Rice',description:'Wok-tossed rice, egg, anchovy, sambal.',price:13,image:imgs.rice,available:true,sold:67},{id:'p8',name:'Coconut Curry Chicken',description:'Slow-simmered curry with fluffy rice.',price:17.5,image:imgs.chicken,available:true,sold:42},{id:'p9',name:'Lemon Iced Tea',description:'Fresh brewed tea, citrus and a little sunshine.',price:5.5,image:imgs.tea,available:true,sold:33}]},{id:'s4',name:'Mellow Cup',category:'Tea & treats',desc:'Milk tea, fruit tea and something sweet for the afternoon.',rating:4.6,ratings:82,time:'10–15 min',open:true,categoryKey:'Cafe',image:imgs.tea,products:[{id:'p10',name:'Brown Sugar Milk Tea',description:'Slow-cooked brown sugar, silky milk, chewy pearls.',price:9.5,image:imgs.tea,available:true,sold:73},{id:'p11',name:'Mango Cloud Tea',description:'Bright mango tea topped with a soft cream cap.',price:11,image:imgs.tea,available:true,sold:38},{id:'p12',name:'Vanilla Pudding Cup',description:'Chilled vanilla pudding, made in-house.',price:7,image:imgs.dessert,available:true,sold:21}]}],orders:[{id:'CT-1048',storeId:'s1',student:'Aisha R.',items:[{name:'Ginger Sesame Noodles',qty:1,price:12.9},{name:'Iced Oat Latte',qty:1,price:10.5}],total:23.4,note:'Less spicy please',status:'preparing',eta:20,created:Date.now()-12*60000,accepted:true},{id:'CT-1047',storeId:'s1',student:'Daniel K.',items:[{name:'Crispy Chicken Rice Bowl',qty:1,price:16.5}],total:16.5,note:'',status:'ready',eta:25,created:Date.now()-37*60000,accepted:true}],reviews:[{id:'r1',storeId:'s1',name:'Maya L.',stars:5,tags:['So flavourful','Good portion'],text:'The sesame noodles were so satisfying. Ready right on time!',reply:'Thank you, Maya! So glad you enjoyed your lunch.'},{id:'r2',storeId:'s1',name:'Anonymous',stars:4,tags:['Fresh ingredients'],text:'Really fresh and tasty. Will be back.'},{id:'r3',storeId:'s2',name:'Anonymous',stars:5,tags:['Lovely coffee','Friendly service'],text:'My new study break favourite.'}],users:[],cart:[],session:null,studentTab:'browse',vendorTab:'orders',selectedStore:null,query:'',filter:'All',category:'All',toast:'',reviewed:[]};
let db=load();function load(){try{return {...seed,...JSON.parse(localStorage.getItem('campus-table-v1')||'{}')}}catch{return structuredClone(seed)}}function save(){localStorage.setItem('campus-table-v1',JSON.stringify(db))}let timer;function flash(s){db.toast=s;render();clearTimeout(timer);timer=setTimeout(()=>{db.toast='';render()},2500)}function store(id){return db.stores.find(s=>s.id===id)}function money(x){return 'RM '+Number(x).toFixed(2)}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const app=document.querySelector('#app');app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">⌂</div><div>Campus Table<small>GOOD FOOD, AROUND THE CORNER</small></div></div><nav class="nav">${db.session?.role==='vendor'?`<button class="${db.vendorTab==='orders'?'active':''}" onclick="setVendor('orders')">Orders ${db.orders.filter(o=>o.storeId==='s1'&&o.status==='pending').length?'<span class="badge">new</span>':''}</button><button class="${db.vendorTab==='menu'?'active':''}" onclick="setVendor('menu')">My menu</button><button class="${db.vendorTab==='reports'?'active':''}" onclick="setVendor('reports')">Reports</button><button class="${db.vendorTab==='reviews'?'active':''}" onclick="setVendor('reviews')">Reviews</button>`:`<button class="${db.studentTab==='browse'?'active':''}" onclick="setStudent('browse')">Explore</button><button class="${db.studentTab==='orders'?'active':''}" onclick="setStudent('orders')">My orders</button><button class="${db.studentTab==='history'?'active':''}" onclick="setStudent('history')">Past orders</button><button class="${db.studentTab==='profile'?'active':''}" onclick="setStudent('profile')">My profile</button>`}</nav><div class="right"><div class="role-switch"><button class="${db.session?.role!=='vendor'?'active':''}" onclick="switchRole('student')">Student</button><button class="${db.session?.role==='vendor'?'active':''}" onclick="switchRole('vendor')">Vendor</button></div><div class="user-pill"><div class="avatar">${db.session?esc(db.session.name[0].toUpperCase()):'G'}</div>${db.session?esc(db.session.name.split(' ')[0]):'Guest'}</div></div></header><main class="main">${db.session?.role==='vendor'?vendorView():studentView()}</main><footer class="footer"><span>© 2025 Campus Table · Made for campus, made with care</span><span>Pickup only · Pay at the stall</span></footer>${db.toast?`<div class="toast">${esc(db.toast)}</div>`:''}</div>`}
function studentView(){if(db.studentTab==='orders')return studentOrders(false);if(db.studentTab==='history')return studentOrders(true);if(db.studentTab==='profile')return profileView();if(db.selectedStore)return storeView();return browseView()}
function browseView(){let list=db.stores.filter(s=>(db.filter==='All'||s.categoryKey===db.filter)&&(!db.query||`${s.name} ${s.category} ${s.products.map(p=>p.name).join(' ')}`.toLowerCase().includes(db.query.toLowerCase())));return `<div class="welcome"><div><div class="eyebrow">A good meal is closer than you think</div><h1>What sounds good today?</h1><p>Find your next campus favourite.</p></div><div class="date-note">● &nbsp;Pick up on campus</div></div><section class="hero"><div class="eyebrow">YOUR CAMPUS, SERVED FRESH</div><h2>Good food. Good mood.<br>Just around the corner.</h2><p>Browse campus stalls and find something lovely.</p><div class="search-row"><label class="search">⌕ <input placeholder="Search dishes or stalls…" value="${esc(db.query)}" oninput="db.query=this.value;save();render()"></label><button class="btn light" onclick="document.querySelector('.search input').focus()">Search</button></div></section><div class="section-head"><div><h2>Find your kind of good</h2><p>Independent campus stalls, ready when you are.</p></div></div><div class="filters">${['All','Asian','Cafe','Local'].map(c=>`<button class="filter ${db.filter===c?'active':''}" onclick="db.filter='${c}';render()">${c==='All'?'All stalls':c}</button>`).join('')}</div><div class="store-grid">${list.map(storeCard).join('')||'<div class="empty">No stalls match that search yet.</div>'}</div>`}
function storeCard(s){return `<article class="store-card" onclick="openStore('${s.id}')"><div class="store-image" style="background-image:url('${s.image}')">${!s.open?'<span class="closed">CLOSED</span>':''}</div><div class="store-info"><div class="store-title"><h3>${esc(s.name)}</h3><span class="rating">★ ${s.rating.toFixed(1)} <span style="color:#b18b58;font-weight:500">(${s.ratings})</span></span></div><p>${esc(s.category)} · ${s.products.length} menu favourites</p><div class="meta"><span>◷ ${s.time}</span><span class="tag">Pickup</span></div></div></article>`}
function openStore(id){db.selectedStore=id;db.category='All';db.query='';render()}function storeView(){const s=store(db.selectedStore);if(!s){db.selectedStore=null;return browseView()}let products=s.products.filter(p=>(db.category==='All'||p.category===db.category)&&(!db.query||`${p.name} ${p.description}`.toLowerCase().includes(db.query.toLowerCase())));return `<button class="back" onclick="db.selectedStore=null;db.query='';render()">← &nbsp;All stalls</button><div class="store-detail"><div class="store-image" style="background-image:url('${s.image}')"></div><div><div class="eyebrow">${esc(s.category)}</div><h1>${esc(s.name)}</h1><div class="inline"><span class="rating">★ ${s.rating.toFixed(1)} (${s.ratings} reviews)</span><span class="subtle">◷ ${s.time} · Pickup</span></div><p>${esc(s.desc)}</p></div></div><div class="section-head"><div><h2>Made fresh for you</h2><p>Tap + to add something to your bag.</p></div><label class="search" style="max-width:240px;height:38px">⌕ <input placeholder="Find a dish" value="${esc(db.query)}" oninput="db.query=this.value;render()"></label></div><div class="menu-grid">${products.map(p=>`<article class="menu-card"><img class="food-image" src="${p.image}" alt="${esc(p.name)}"><div class="menu-copy"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span></div><button class="add" ${!p.available?'disabled':''} aria-label="Add ${esc(p.name)}" onclick="addCart('${s.id}','${p.id}')">${p.available?'+':'–'}</button></article>`).join('')||'<div class="empty">No dishes found.</div>'}</div>${db.cart.length?`<div style="position:fixed;bottom:20px;right:24px;z-index:5"><button class="btn primary" onclick="setStudent('cart')">View bag · ${db.cart.reduce((a,i)=>a+i.qty,0)} items · ${money(cartTotal())}</button></div>`:''}`}
function addCart(sid,pid){if(!db.session){authModal('register');return}if(db.cart.length&&db.cart[0].storeId!==sid){flash('Your bag has items from another stall. Finish or clear it first.');return}let s=store(sid),p=s.products.find(x=>x.id===pid),item=db.cart.find(x=>x.productId===pid);if(item)item.qty++;else db.cart.push({storeId:sid,productId:pid,name:p.name,price:p.price,qty:1});save();flash(`${p.name} added to your bag`)}function cartTotal(){return db.cart.reduce((a,i)=>a+i.price*i.qty,0)}
function studentOrders(history){let arr=db.orders.filter(o=>o.student===db.session?.name&&(history?['completed','cancelled','rejected'].includes(o.status):!['completed','cancelled','rejected'].includes(o.status)));return `<div class="welcome"><div><div class="eyebrow">${history?'YOUR CAMPUS FAVOURITES':'PICKUP, MADE EASY'}</div><h1>${history?'Past orders':'My orders'}</h1><p>${history?'Order again or leave a rating for a completed order.':'Follow your order from the kitchen to the counter.'}</p></div></div>${arr.length?arr.map(o=>orderCard(o,false)).join(''):'<div class="panel empty"><div>◷</div><h3>No orders here yet</h3><p>When you place an order, you’ll find it here.</p><button class="btn primary" onclick="setStudent(\'browse\')">Explore stalls</button></div>'}`}
function orderCard(o,vendor){let s=store(o.storeId),stages=['accepted','preparing','ready','completed'],at=stages.indexOf(o.status),statusLabel={pending:'Awaiting response',accepted:'Accepted',preparing:'Preparing',ready:'Ready for pickup',completed:'Completed',cancelled:'Cancelled',rejected:'Declined'}[o.status]||o.status;return `<article class="order-card"><div class="order-top"><div><h3>${esc(s?.name||'Campus stall')} <span class="subtle">· #${o.id}</span></h3><div class="subtle">${new Date(o.created).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div></div><span class="status ${o.status}">${statusLabel}</span></div>${o.status==='rejected'?`<div class="notice">Reason from stall: ${esc(o.reason||'Item unavailable')}</div>`:o.status==='cancelled'?`<p class="subtle">This order was cancelled by the student.</p>`:`<div class="progress">${['Accepted','Preparing','Ready','Picked up'].map((t,i)=>`<div class="step ${i<=at?'done':''}"><span class="dot">${i<at?'✓':i+1}</span>${t}</div>${i<3?`<div class="connector ${i<at?'done':''}"></div>`:''}`).join('')}</div><div class="inline" style="justify-content:space-between"><span class="subtle">${o.status==='ready'?'Please collect at the stall counter.':`Estimated pickup: ${new Date(o.created+(o.eta||20)*60000).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'})}`}</span><strong>${money(o.total)}</strong></div>`}${vendor?vendorOrderActions(o):o.status==='pending'||(['accepted','preparing'].includes(o.status)&&o.eta>60)?`<div class="order-actions"><button class="btn danger" onclick="cancelOrder('${o.id}')">Cancel order${o.status!=='pending'?' · long wait':''}</button></div>`:o.status==='completed'&&!db.reviewed.includes(o.id)?`<div class="order-actions"><button class="btn soft" onclick="reviewModal('${o.id}')">★ Rate this order</button></div>`:''}</article>`}
function cancelOrder(id){let o=db.orders.find(x=>x.id===id);if(o.status!=='pending'&&o.eta<=60){flash('This order can no longer be cancelled.');return}o.status='cancelled';save();flash('Order cancelled. The stall has been notified.')}function profileView(){let who=db.session?.name||'Guest';return `<div class="welcome"><div><div class="eyebrow">YOUR CAMPUS TABLE</div><h1>My profile</h1><p>Account and your campus dining snapshot.</p></div></div><div class="two-col"><section class="panel"><h3>Account details</h3><div class="line-row"><span class="subtle">Name</span><strong>${esc(who)}</strong></div><div class="line-row"><span class="subtle">Email</span><strong>${esc(db.session?.email||'Guest browsing')}</strong></div><div class="order-actions"><button class="btn light" onclick="editAccount()">Edit details</button><button class="btn light" onclick="logout()">Log out</button><button class="btn danger" onclick="deleteAccount()">Delete account</button></div></section><section class="panel"><h3>Your spending snapshot</h3><div class="stat" style="border:0;padding:6px 0"><label>Completed orders · this month</label><strong>${money(db.orders.filter(o=>o.student===who&&o.status==='completed'&&new Date(o.created).getMonth()===new Date().getMonth()).reduce((a,o)=>a+o.total,0))}</strong><small>Actual payment is made at the stall</small></div><button class="btn soft" onclick="setStudent('history')">View past orders →</button></section></div>`}
function vendorView(){return `<div class="welcome"><div><div class="eyebrow">LITTLE FERN CAFÉ · VENDOR STUDIO</div><h1>${({orders:'A little order at a time.',menu:'Your menu, your way.',reports:'A good month at a glance.',reviews:'Kind words from your customers.'})[db.vendorTab]}</h1><p>Manage your stall and make every pickup a good one.</p></div><div class="date-note"><span class="tag">● Open today</span></div></div><div class="vendor-layout"><aside class="side-menu"><button class="${db.vendorTab==='orders'?'active':''}" onclick="setVendor('orders')">Order queue <span>${db.orders.filter(o=>o.storeId==='s1'&&o.status==='pending').length}</span></button><button class="${db.vendorTab==='menu'?'active':''}" onclick="setVendor('menu')">Menu & availability</button><button class="${db.vendorTab==='reports'?'active':''}" onclick="setVendor('reports')">Sales report</button><button class="${db.vendorTab==='reviews'?'active':''}" onclick="setVendor('reviews')">Customer reviews</button></aside><section>${vendorTabView()}</section></div>`}
function vendorTabView(){if(db.vendorTab==='orders'){let ord=db.orders.filter(o=>o.storeId==='s1');return `<div class="tabs"><button class="active">All orders (${ord.length})</button><button>Needs review (${ord.filter(o=>o.status==='pending').length})</button></div>${ord.length?ord.map(o=>orderCard(o,true)).join(''):'<div class="panel empty"><div>✓</div><h3>You’re all caught up</h3><p>New orders will appear here.</p></div>'}`}if(db.vendorTab==='menu'){let s=store('s1');return `<div class="panel"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><div><h3 style="margin-bottom:3px">Menu & availability</h3><span class="subtle">Changes appear on your stall page right away.</span></div><button class="btn primary" onclick="productModal()">＋ Add item</button></div>${s.products.map(p=>`<div class="product-row"><img src="${p.image}"><div class="grow"><h4>${esc(p.name)}</h4><span class="subtle">${money(p.price)} · ${esc(p.description)}</span></div><span class="badge">${p.available?'Available':'Sold out'}</span><button class="switch ${p.available?'on':''}" aria-label="Toggle availability" onclick="toggleProduct('${p.id}')"></button><button class="btn light" style="padding:8px" onclick="productModal('${p.id}')">Edit</button></div>`).join('')}</div>`}if(db.vendorTab==='reports'){let rev=db.orders.filter(o=>o.storeId==='s1'&&o.status==='completed'),gross=rev.reduce((a,o)=>a+o.total,0),completed=rev.length;return `<div class="stats"><div class="stat"><label>Sales this month</label><strong>${money(gross||1284.5)}</strong><small>↑ 12% from last month</small></div><div class="stat"><label>Orders completed</label><strong>${completed||86}</strong><small>↑ 8% from last month</small></div><div class="stat"><label>Average order</label><strong>${money(gross&&completed?gross/completed:14.9)}</strong><small>Across completed pickups</small></div><div class="stat"><label>Customer rating</label><strong>4.9 ★</strong><small>From 96 reviews</small></div></div><div class="two-col"><div class="panel"><h3>Sales · last 7 days</h3><div class="bar-list">${[68,45,83,60,94,53,76].map((v,i)=>`<div class="bar-col"><b>RM ${[178,121,226,164,248,139,204][i]}</b><div class="bar ${i===4?'highlight':''}" style="height:${v}%"></div><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div>`).join('')}</div></div><div class="panel"><h3>Customer favourites</h3>${store('s1').products.slice().sort((a,b)=>b.sold-a.sold).map((p,i)=>`<div class="line-row"><span><span class="badge">${i+1}</span> &nbsp;${esc(p.name)}</span><strong>${p.sold} orders</strong></div>`).join('')}<p class="subtle" style="margin-bottom:0">Sales shown are completed order totals. Payment is collected in person.</p></div></div>`}return `<div class="panel"><h3>Customer reviews <span class="rating">★ 4.9</span></h3>${db.reviews.filter(r=>r.storeId==='s1').map(reviewCard).join('')}</div>`}
function reviewCard(r){return `<article class="review-card"><div class="inline" style="justify-content:space-between"><div><strong>${esc(r.name)}</strong> <span class="subtle">· Verified order</span></div><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div>${r.tags.map(t=>`<span class="tag" style="display:inline-block;margin:10px 4px 0 0">${esc(t)}</span>`).join('')}<p>${esc(r.text)}</p>${r.reply?`<div class="reply"><strong>Little Fern Café replied</strong><br>${esc(r.reply)}</div>`:`<button class="btn soft" onclick="replyModal('${r.id}')">Reply to review</button>`}</article>`}
function vendorOrderActions(o){if(o.status==='pending')return `<div class="order-actions"><button class="btn green" onclick="acceptOrder('${o.id}')">Accept order</button><button class="btn danger" onclick="rejectModal('${o.id}')">Decline · add reason</button><span class="subtle" style="align-self:center">Default pickup estimate: 20 min</span></div>`;if(o.status==='accepted')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','preparing')">Start preparing</button><span class="subtle" style="align-self:center">Pickup in about ${o.eta} min</span></div>`;if(o.status==='preparing')return `<div class="order-actions"><button class="btn green" onclick="setStatus('${o.id}','ready')">Mark ready for pickup</button></div>`;if(o.status==='ready')return `<div class="order-actions"><button class="btn primary" onclick="setStatus('${o.id}','completed')">Mark picked up</button></div>`;return ''}
function setStudent(tab){if(tab==='cart'){if(!db.session){authModal('register');return}renderCart();return}db.studentTab=tab;db.selectedStore=null;render()}function setVendor(tab){db.vendorTab=tab;render()}function switchRole(role){if(role==='vendor'&&db.session?.role!=='vendor'){authModal('vendor');return}if(role==='student'&&db.session?.role==='vendor'){db.session={...db.session,role:'student'};db.studentTab='browse';save()}render()}function renderCart(){db.studentTab='cart';let s=db.cart.length?store(db.cart[0].storeId):null;document.querySelector('.main').innerHTML=`<div class="welcome"><div><div class="eyebrow">ONE LAST LOOK</div><h1>Your pickup bag</h1><p>${s?`From ${esc(s.name)} · Pay at the stall when you collect.`:'Your bag is waiting for something tasty.'}</p></div></div>${db.cart.length?`<div class="two-col"><section class="panel"><h3>Order items</h3>${db.cart.map((i,n)=>`<div class="cart-row"><div><strong>${esc(i.name)}</strong><div class="subtle">${money(i.price)} each</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button>${i.qty}<button onclick="changeQty(${n},1)">+</button><strong style="min-width:67px;text-align:right">${money(i.qty*i.price)}</strong></div></div>`).join('')}<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div><button class="btn light" onclick="db.cart=[];save();flash('Bag cleared');renderCart()">Clear bag</button></section><section class="panel"><h3>Pickup notes</h3><p class="subtle">Anything the stall should know?</p><textarea class="textarea" id="orderNote" placeholder="e.g. No chilli, please"></textarea><div class="muted-box" style="margin:14px 0">◎ &nbsp;Pickup only<br>Payment is made directly at the stall when you collect.</div><button class="btn primary full" onclick="checkout()">Place order · ${money(cartTotal())}</button></section></div>`:'<div class="panel empty"><div>♧</div><h3>Your bag is empty</h3><button class="btn primary" onclick="setStudent(\'browse\')">Explore stalls</button></div>'}`;window.scrollTo(0,0)}function changeQty(n,d){db.cart[n].qty+=d;if(db.cart[n].qty<1)db.cart.splice(n,1);save();renderCart()}function checkout(){if(!db.session){authModal('register');return}if(!db.cart.length)return;let s=store(db.cart[0].storeId);let id='CT-'+(1050+db.orders.length);db.orders.unshift({id,storeId:s.id,student:db.session.name,items:db.cart.map(({name,price,qty})=>({name,price,qty})),total:cartTotal(),note:document.querySelector('#orderNote').value,status:'pending',eta:20,created:Date.now(),accepted:false});db.cart=[];db.studentTab='orders';save();render();flash('Order placed! The stall has been notified.')}
function acceptOrder(id){let o=db.orders.find(x=>x.id===id);o.status='accepted';o.accepted=true;o.eta=20;let ans=prompt('Estimated pickup time in minutes (default 20):','20');if(ans!==null&&Number(ans)>0)o.eta=Math.min(180,Number(ans));save();render()}function setStatus(id,status){let o=db.orders.find(x=>x.id===id);o.status=status;save();render();flash(status==='ready'?'Student notified: order ready for pickup.':'Order status updated.')}function rejectModal(id){modal(`<h2>Decline this order</h2><p>Let the student know what happened.</p><div class="form-row"><label>Reason</label><textarea class="textarea" id="reason" placeholder="e.g. Tapioca pearls are sold out today" required></textarea></div><div class="order-actions"><button class="btn light" onclick="closeModal()">Keep order</button><button class="btn danger" onclick="rejectOrder('${id}')">Decline order</button></div>`)}function rejectOrder(id){let reason=document.querySelector('#reason').value.trim();if(!reason){flash('Please add a short reason for the student.');return}let o=db.orders.find(x=>x.id===id);o.status='rejected';o.reason=reason;save();closeModal();render();flash('Student notified that the order was declined.')}
function authModal(mode='register'){let vendor=mode==='vendor';modal(`<h2>${vendor?'Vendor sign in':'Welcome to Campus Table'}</h2><p>${vendor?'Use the demo stall account to open Vendor Studio.':'Create an account to place an order and save your favourites.'}</p><div class="tabs"><button class="active" id="tab-register" onclick="authMode('register')">Register</button><button id="tab-login" onclick="authMode('login')">Log in</button></div><form onsubmit="authSubmit(event,'${vendor?'vendor':'student'}')"><div class="form-row" id="name-row"><label>${vendor?'Stall owner name':'Your name'}</label><input class="field" name="name" placeholder="e.g. Aisha Rahman" value="${vendor?'Little Fern Owner':''}" required></div><div class="form-row"><label>Email</label><input class="field" name="email" type="email" placeholder="you@campus.edu" value="${vendor?'vendor@littlefern.demo':''}" required></div><div class="form-row"><label>Password</label><input class="field" name="password" type="password" placeholder="At least 6 characters" value="${vendor?'campusdemo':''}" minlength="6" required></div>${vendor?'<div class="notice">Demo vendor login is prefilled. Registering a new vendor creates a local demo profile.</div>':''}<button class="btn primary full" type="submit">${vendor?'Continue to Vendor Studio':'Create account'}</button></form><div class="notice">Demo mode: accounts and orders are stored in this browser only.</div>`);window.authCurrent='register';window.authTarget=vendor?'vendor':'student'}function authMode(m){window.authCurrent=m;document.querySelector('#tab-register').classList.toggle('active',m==='register');document.querySelector('#tab-login').classList.toggle('active',m==='login');document.querySelector('#name-row').classList.toggle('hidden',m==='login');document.querySelector('#name-row input').required=m==='register';document.querySelector('form button[type=submit]').textContent=m==='login'?'Log in':window.authTarget==='vendor'?'Continue to Vendor Studio':'Create account'}function authSubmit(e,role){e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),pw=f.get('password'),user=db.users.find(u=>u.email===email);if(window.authCurrent==='login'){if(!user||user.password!==pw){flash('We could not find that account. Check your details or register first.');return}db.session={name:user.name,email:user.email,role:role==='vendor'?user.role:user.role};if(role==='vendor')db.session={...db.session,role:'vendor'};}else{if(user){flash('That email already has an account. Please log in.');return}let name=f.get('name').trim();user={name,email,password:pw,role};db.users.push(user);db.session={name,email,role};}save();closeModal();render();flash(`Welcome${db.session.name?', '+db.session.name.split(' ')[0]:''}!`)}function logout(){db.session=null;db.studentTab='browse';save();render();flash('You are logged out.')}function editAccount(){if(!db.session){authModal('register');return}modal(`<h2>Edit account</h2><p>Update your display name.</p><div class="form-row"><label>Name</label><input id="editName" class="field" value="${esc(db.session.name)}"></div><button class="btn primary full" onclick="saveAccount()">Save changes</button>`)}function saveAccount(){let n=document.querySelector('#editName').value.trim();if(!n)return;let old=db.session.name;db.session.name=n;let u=db.users.find(x=>x.email===db.session.email);if(u)u.name=n;db.orders.forEach(o=>{if(o.student===old)o.student=n});save();closeModal();render();flash('Account details updated.')}function deleteAccount(){if(!confirm('Delete your account? Past orders and reviews will stay as anonymous records for store reporting.'))return;let old=db.session?.name;db.users=db.users.filter(u=>u.email!==db.session?.email);db.orders.forEach(o=>{if(o.student===old)o.student='Anonymous'});db.reviews.forEach(r=>{if(r.name===old)r.name='Anonymous'});db.session=null;db.cart=[];save();render();flash('Account deleted. Your history was anonymized.')}
function productModal(id){let p=id?store('s1').products.find(x=>x.id===id):{};modal(`<h2>${id?'Edit menu item':'Add a menu item'}</h2><p>Keep your menu fresh and clear.</p><form onsubmit="saveProduct(event,'${id||''}')"><div class="form-row"><label>Item name</label><input class="field" name="name" value="${esc(p.name||'')}" required></div><div class="form-row"><label>Price (RM)</label><input class="field" type="number" name="price" step="0.10" min="0" value="${p.price||''}" required></div><div class="form-row"><label>Description</label><textarea class="textarea" name="description" required>${esc(p.description||'')}</textarea></div><div class="form-row"><label>Photo URL</label><input class="field" name="image" value="${esc(p.image||imgs.bowl)}" placeholder="Paste an image URL"></div><button class="btn primary full">Save item</button></form>`)}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),p={id:id||'p'+Date.now(),name:f.get('name'),price:Number(f.get('price')),description:f.get('description'),image:f.get('image')||imgs.bowl,available:true,sold:0};if(id){let ix=store('s1').products.findIndex(x=>x.id===id);p.available=store('s1').products[ix].available;p.sold=store('s1').products[ix].sold;store('s1').products[ix]=p}else store('s1').products.push(p);save();closeModal();render();flash(id?'Item updated.':'New item added to your menu.')}function toggleProduct(id){let p=store('s1').products.find(x=>x.id===id);p.available=!p.available;save();render();flash(p.available?'Item is available again.':'Marked as sold out.')}
function reviewModal(orderId){let o=db.orders.find(x=>x.id===orderId);modal(`<h2>How was your pickup?</h2><p>Your review helps the campus community choose well.</p><div class="form-row"><label>Rating</label><select id="stars" class="field"><option value="5">★★★★★ — Loved it</option><option value="4">★★★★☆ — Very good</option><option value="3">★★★☆☆ — It was okay</option><option value="2">★★☆☆☆ — Could be better</option><option value="1">★☆☆☆☆ — Disappointed</option></select></div><div class="form-row"><label>Quick notes (optional)</label><div class="filters">${['So flavourful','Very fresh','Good portion','Lovely service','Great value'].map(x=>`<button type="button" class="filter" onclick="this.classList.toggle('active')">${x}</button>`).join('')}</div></div><div class="form-row"><label>Your comment</label><textarea id="reviewText" class="textarea" placeholder="Share a little about your experience…"></textarea></div><button class="btn primary full" onclick="submitReview('${orderId}')">Post review</button>`)}function submitReview(id){let o=db.orders.find(x=>x.id===id),tags=[...document.querySelectorAll('.filters .active')].map(x=>x.textContent),stars=Number(document.querySelector('#stars').value),text=document.querySelector('#reviewText').value.trim();db.reviews.unshift({id:'r'+Date.now(),storeId:o.storeId,name:db.session.name,stars,tags,text,reply:''});db.reviewed.push(id);let s=store(o.storeId);s.rating=Number(((s.rating*s.ratings+stars)/(s.ratings+1)).toFixed(1));s.ratings++;save();closeModal();render();flash('Thanks for sharing your experience!')}function replyModal(id){let r=db.reviews.find(x=>x.id===id);modal(`<h2>Reply to review</h2><p>${esc(r.text)}</p><textarea id="replyText" class="textarea" placeholder="Write a warm reply…"></textarea><button class="btn primary full" style="margin-top:12px" onclick="saveReply('${id}')">Post reply</button>`)}function saveReply(id){let t=document.querySelector('#replyText').value.trim();if(!t)return;db.reviews.find(x=>x.id===id).reply=t;save();closeModal();render();flash('Reply posted.')}
function modal(html){let old=document.querySelector('.modal-bg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<button aria-label="Close" onclick="closeModal()" style="position:absolute;opacity:0;pointer-events:none"></button><div style="text-align:right;margin-top:12px"><button onclick="closeModal()" class="back">Close</button></div></div></div>`)}function closeModal(){document.querySelector('.modal-bg')?.remove()}render();
</script></body></html>
